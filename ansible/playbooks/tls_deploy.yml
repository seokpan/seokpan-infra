#
# harbor.stone.test(registry), gateway(loadbalancer), db.stone.test(database),
# k8s-api.stone.test(control_planes) 각 그룹에 tls_service_* 변수가
# host_vars/group_vars로 정의되어 있어야 한다.

- name: Deploy TLS certificates signed by Internal CA
  hosts: registry:loadbalancer:database:control_planes
  become: true

  roles:
    - tls_deploy
