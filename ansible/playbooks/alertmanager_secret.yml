# 작성 날짜: 2026-09-15
#
# jenkins_secrets.yml(PR #98 반영 기준)과 동일하게 hosts: localhost /
# connection: local / gather_facts: false — 특정 물리 노드(cp-03 등)에
# 결합되지 않고 Ansible Controller에서 kubeconfig로 Cluster API를 직접 호출.

- name: Alertmanager SMTP Secret Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - alertmanager_secret
