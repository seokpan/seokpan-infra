---
# Owner: 정태훈
# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: Reproduce Kubernetes cluster, Calico network, and bootstrap add-ons

- name: Prepare first Kubernetes control plane
  hosts: cp-01
  gather_facts: true
  roles:
    - kubeadm_control_plane

- name: Join additional Kubernetes control plane nodes
  hosts: "control_planes:!cp-01"
  gather_facts: true
  serial: 1
  roles:
    - kubeadm_control_plane_join

- name: Prepare Kubernetes worker nodes
  hosts: workers
  gather_facts: true
  serial: 1
  roles:
    - kubeadm_worker

- name: Install and validate Calico
  hosts: cp-01
  gather_facts: false
  roles:
    - calico

- name: Bootstrap Kubernetes add-ons
  hosts: cp-01
  become: true
  gather_facts: false
  roles:
    - k8s_addons

