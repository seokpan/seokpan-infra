---
# 작성자: 최유준
# 작성 날짜: 2026-08-27
#
# image pull(Worker), Gateway 접근, DB 접속 등에서 Root CA를 신뢰해야 하는
# 모든 노드가 대상. 우선 K8s 관련 노드 전체 + registry로 시작하고,
# Jenkins Agent가 별도 Pod로 뜨는 경우는 K8s 노드에 이미 포함되므로 커버됨.

- name: Distribute Root CA to trust stores
  hosts: control_planes:workers:registry:loadbalancer:database
  become: true

  roles:
    - ca_trust
