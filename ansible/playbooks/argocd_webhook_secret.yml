# 작성 날짜: 2026-09-18
#
# Argo CD Webhook GitHub Secret을 argocd-secret에 반영하는 Playbook.
# alertmanager_secret.yml(PR #98 반영 기준)과 동일하게 hosts: localhost /
# connection: local / gather_facts: false — 특정 물리 노드에 결합되지 않고
# Ansible Controller에서 kubeconfig로 Cluster API를 직접 호출.
#
# seokpan-gitops PR #<번호> 리뷰 Blocker 대응: Gateway route(HTTPRoute) 공개 전
# 반드시 이 Playbook을 먼저 실행하여 webhook.github.secret이 활성화된 상태로
# route가 노출되도록 한다.

- name: Argo CD Webhook Secret Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - argocd_webhook_secret
