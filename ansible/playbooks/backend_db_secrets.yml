# Owner: 정태훈
# Scope: Runtime Platform / Kubernetes Secret Bootstrap
# Project: 石나가는 판단
# Related: seokpan-infra#150, seokpan-gitops#40, seokpan-gitops#44
#
# Backend DB Runtime/Migration Credential은 기존 Ansible Vault를 Source of Truth로
# 사용하며 GitOps Repository에는 Secret 값 자체를 저장하지 않는다.

- name: Backend DB Runtime and Migration Secret Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - backend_db_secrets
