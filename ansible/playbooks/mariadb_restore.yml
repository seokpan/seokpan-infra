---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: 결정된 백업 경로로부터 격리 환경 Restore 실행 (이슈 #55 코멘트 결정사항)
#
# 실행 예:
#   ansible-playbook playbooks/mariadb_restore.yml -l mariadb-02 --ask-vault-pass \
#     -e backup_restore_source_dir=/srv/nfs/db-backup/full_20260903_020000

- name: MariaDB 격리 환경 Restore 및 표본 검증
  hosts: mariadbs
  become: true
  gather_facts: true

  tasks:
    - name: 실제 Master 판별 (비교 기준 확보용)
      ansible.builtin.import_role:
        name: backup_transfer
        tasks_from: detect_master

    - name: 복구 실행
      ansible.builtin.import_role:
        name: backup_transfer
        tasks_from: restore
