#
# [수정 이력, 09/02] PR #98 리뷰 반영: Task 레벨(delegate_to: localhost)뿐 아니라
# Play 헤더 자체도 cp-03 의존을 제거. argocd_bootstrap.yml과 동일한 기준
# (hosts: localhost / connection: local / gather_facts: false).
# 기존 hosts: cp-03 + become: true 상태에서는 gather_facts 기본값(true)으로 인해
# 매 실행마다 cp-03에 실제 SSH 접속이 발생해 cp-03 물리 노드에 여전히 결합돼 있었음.

- name: Jenkins Secret Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - jenkins_secrets
