---
# 작성자: 석판팀
# Project: 石나가는 판단
# Scope: Gateway TLS Certificate / Kubernetes TLS Secret Provider
# 관련: seokpan-infra#111, seokpan-gitops#22
#
# 원칙:
# - Seokpan Internal Root CA는 재사용한다.
# - Gateway 전용 Leaf Certificate/Private Key는 Harbor와 분리한다.
# - CA Private Key는 Controller 밖으로 반출하지 않는다.
# - Gateway/NginxProxy는 GitOps가 소유하며 이 Role은 TLS Secret Provider만 담당한다.
# - Secret 실제 값/Private Key는 로그에 노출하지 않는다.
# - Check Mode는 Preflight/현재 상태 판정까지만 수행하고 실제 발급·Secret 변경은 수행하지 않는다.

# ============================================================
# 1. 실행 위치 / 필수 계약 Preflight
# ============================================================

- name: Gateway TLS Role이 Ansible Controller에서 실행되는지 확인
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['ansible_controller']
      - cluster_kubeconfig is defined
      - gateway_tls_fqdn | length > 0
      - gateway_tls_san | length > 0
      - gateway_tls_namespace | length > 0
      - gateway_tls_secret_name | length > 0
      - gateway_tls_source in ['internal_ca', 'external_acme']
    fail_msg: >-
      gateway_tls Role은 ansible_controller에서 실행해야 하며
      cluster_kubeconfig 및 Gateway TLS 계약 변수가 필요합니다.

- name: Gateway TLS 유효 Certificate와 Private Key 경로 확정
  ansible.builtin.set_fact:
    gateway_tls_effective_cert_path: >-
      {{ gateway_tls_cert_path if gateway_tls_source == 'internal_ca'
         else gateway_tls_external_fullchain_path }}
    gateway_tls_effective_key_path: >-
      {{ gateway_tls_key_path if gateway_tls_source == 'internal_ca'
         else gateway_tls_external_key_path }}

- name: Internal Root CA Certificate 존재 확인
  ansible.builtin.stat:
    path: "{{ internal_ca_cert_path }}"
  register: gateway_tls_root_ca_cert
  when: gateway_tls_source == 'internal_ca'

- name: Internal Root CA Private Key 존재 확인
  ansible.builtin.stat:
    path: "{{ internal_ca_key_path }}"
  register: gateway_tls_root_ca_key
  no_log: true
  when: gateway_tls_source == 'internal_ca'

- name: Internal Root CA 준비 상태 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_root_ca_cert.stat.exists
      - gateway_tls_root_ca_key.stat.exists
    fail_msg: >-
      Seokpan Internal Root CA가 준비되어 있지 않습니다.
      playbooks/internal_ca.yml을 먼저 확인하세요.
  when: gateway_tls_source == 'internal_ca'

- name: External ACME Fullchain 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_external_fullchain_path }}"
    follow: true
  register: gateway_tls_external_fullchain
  when: gateway_tls_source == 'external_acme'

- name: External ACME Private Key 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_external_key_path }}"
    follow: true
  register: gateway_tls_external_key
  no_log: true
  when: gateway_tls_source == 'external_acme'

- name: External ACME 입력 계약 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_external_fullchain.stat.exists | default(false)
      - gateway_tls_external_fullchain.stat.isreg | default(false)
      - (gateway_tls_external_fullchain.stat.pw_name | default('')) == 'root'
      - gateway_tls_external_key.stat.exists | default(false)
      - gateway_tls_external_key.stat.isreg | default(false)
      - (gateway_tls_external_key.stat.pw_name | default('')) == 'root'
      - (gateway_tls_external_key.stat.mode | default('')) == '0600'
    fail_msg: >-
      External ACME fullchain/key가 없거나 소유자·Private Key 권한이 안전하지 않습니다.
      Kubernetes Secret은 변경하지 않습니다.
  no_log: true
  when: gateway_tls_source == 'external_acme'

- name: External ACME Fullchain Certificate 개수 확인
  ansible.builtin.command:
    argv:
      - grep
      - -c
      - ^-----BEGIN CERTIFICATE-----$
      - "{{ gateway_tls_external_fullchain_path }}"
  register: gateway_tls_external_chain_count
  changed_when: false
  when: gateway_tls_source == 'external_acme'

- name: External ACME Fullchain 계약 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_external_chain_count.stdout | int >= 2
    fail_msg: "External ACME tls.crt 입력은 Leaf와 Intermediate를 포함한 fullchain이어야 합니다."
  when: gateway_tls_source == 'external_acme'

- name: Gateway TLS 대상 Namespace 존재 확인
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ gateway_tls_namespace }}"
  register: gateway_tls_namespace_info
  changed_when: false

- name: Gateway TLS 대상 Namespace 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_namespace_info.resources | length == 1
    fail_msg: >-
      Namespace {{ gateway_tls_namespace }} 가 없습니다.
      Namespace는 GitOps/RBAC Bootstrap 소유이므로 gateway_tls Role에서 임의 생성하지 않습니다.

# ============================================================
# 2. 기존 Leaf Certificate 상태 판정
# ============================================================

- name: 기존 Gateway Certificate 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_effective_cert_path }}"
  register: gateway_tls_existing_cert

- name: 기존 Gateway Private Key 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_effective_key_path }}"
  register: gateway_tls_existing_key
  no_log: true

- name: 기존 Certificate 만료 임박 여부 확인
  ansible.builtin.command:
    cmd: >-
      openssl x509 -in {{ gateway_tls_effective_cert_path }} -noout
      -checkend {{ gateway_tls_renew_before_seconds }}
  register: gateway_tls_existing_expiry
  changed_when: false
  failed_when: false
  when: gateway_tls_existing_cert.stat.exists

- name: 기존 Certificate Hostname/SAN 확인
  ansible.builtin.command:
    cmd: >-
      openssl x509 -in {{ gateway_tls_effective_cert_path }} -noout
      -checkhost {{ gateway_tls_fqdn }}
  register: gateway_tls_existing_hostname
  changed_when: false
  failed_when: false
  when: gateway_tls_existing_cert.stat.exists

- name: 기존 Certificate Public Key 확인
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl x509 -in {{ gateway_tls_effective_cert_path | quote }} -pubkey -noout |
      openssl pkey -pubin -outform DER |
      sha256sum
    executable: /bin/bash
  register: gateway_tls_existing_cert_public_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - gateway_tls_existing_cert.stat.exists
    - gateway_tls_existing_key.stat.exists

- name: 기존 Private Key Public Key 확인
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl pkey -in {{ gateway_tls_effective_key_path | quote }} -pubout -outform DER |
      sha256sum
    executable: /bin/bash
  register: gateway_tls_existing_key_public_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - gateway_tls_existing_cert.stat.exists
    - gateway_tls_existing_key.stat.exists

- name: Gateway Leaf Certificate 재발급 필요 여부 결정
  ansible.builtin.set_fact:
    gateway_tls_needs_issue: >-
      {{
        (not gateway_tls_existing_cert.stat.exists)
        or (not gateway_tls_existing_key.stat.exists)
        or ((gateway_tls_existing_expiry.rc | default(1)) != 0)
        or ((gateway_tls_existing_hostname.rc | default(1)) != 0)
        or ((gateway_tls_existing_cert_public_key.rc | default(1)) != 0)
        or ((gateway_tls_existing_key_public_key.rc | default(1)) != 0)
        or (
          (gateway_tls_existing_cert_public_key.stdout | default(''))
          != (gateway_tls_existing_key_public_key.stdout | default(''))
        )
      }}
  no_log: true

# ============================================================
# 3. Check Mode / Actual Apply 경계
# ============================================================

- name: Check Mode Preflight 결과
  ansible.builtin.debug:
    msg:
      - "FQDN = {{ gateway_tls_fqdn }}"
      - "Namespace = {{ gateway_tls_namespace }}"
      - "Secret = {{ gateway_tls_secret_name }}"
      - "Leaf Certificate 재발급 필요 = {{ gateway_tls_needs_issue }}"
      - "Check Mode에서는 Certificate 발급 및 Kubernetes Secret 변경을 수행하지 않습니다."
  when: ansible_check_mode

- name: Gateway TLS Certificate 발급 및 Kubernetes Secret 수렴
  ansible.builtin.include_tasks: provision.yml
  when: not ansible_check_mode
