---
# 실제 Certificate 발급 / Kubernetes TLS Secret 수렴 전용 Task.
# main.yml에서 `when: not ansible_check_mode` 조건으로만 호출한다.

# ============================================================
# 1. Gateway 전용 Leaf Certificate 발급
# ============================================================

- name: Gateway TLS 작업 디렉토리 준비
  ansible.builtin.file:
    path: "{{ gateway_tls_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: gateway_tls_source == 'internal_ca'

- name: Gateway 전용 Private Key 생성
  ansible.builtin.command:
    cmd: >-
      openssl genrsa -out {{ gateway_tls_key_path }} {{ gateway_tls_key_bits }}
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue
  no_log: true

- name: Gateway CSR 생성
  ansible.builtin.command:
    cmd: >-
      openssl req -new
      -key {{ gateway_tls_key_path }}
      -out {{ gateway_tls_csr_path }}
      -subj /C={{ internal_ca_country }}/O={{ internal_ca_organization }}/CN={{ gateway_tls_fqdn }}
      -addext subjectAltName={{ gateway_tls_san }}
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue
  no_log: true

- name: Gateway SAN Extension 파일 생성
  ansible.builtin.copy:
    dest: "{{ gateway_tls_ext_path }}"
    content: "subjectAltName={{ gateway_tls_san }}\n"
    owner: root
    group: root
    mode: "0600"
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue

- name: Internal Root CA로 Gateway Certificate 서명
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req
      -in {{ gateway_tls_csr_path }}
      -CA {{ internal_ca_cert_path }}
      -CAkey {{ internal_ca_key_path }}
      -CAserial {{ internal_ca_dir }}/ca.srl
      -out {{ gateway_tls_cert_path }}
      -days {{ gateway_tls_days }}
      -sha256
      -extfile {{ gateway_tls_ext_path }}
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue
  no_log: true

- name: Gateway Private Key 권한 고정
  ansible.builtin.file:
    path: "{{ gateway_tls_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when: gateway_tls_source == 'internal_ca'

- name: Gateway Certificate 권한 고정
  ansible.builtin.file:
    path: "{{ gateway_tls_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when: gateway_tls_source == 'internal_ca'

- name: 임시 CSR 제거
  ansible.builtin.file:
    path: "{{ gateway_tls_csr_path }}"
    state: absent
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue

- name: 임시 SAN Extension 파일 제거
  ansible.builtin.file:
    path: "{{ gateway_tls_ext_path }}"
    state: absent
  when:
    - gateway_tls_source == 'internal_ca'
    - gateway_tls_needs_issue

# ============================================================
# 2. 발급 결과 최종 검증
# ============================================================

- name: Gateway Certificate Hostname/SAN 최종 검증
  ansible.builtin.command:
    cmd: >-
      openssl x509 -in {{ gateway_tls_effective_cert_path }} -noout
      -checkhost {{ gateway_tls_fqdn }}
  changed_when: false

- name: Gateway Certificate 만료 기준 최종 검증
  ansible.builtin.command:
    cmd: >-
      openssl x509 -in {{ gateway_tls_effective_cert_path }} -noout
      -checkend {{ gateway_tls_renew_before_seconds }}
  changed_when: false

- name: Gateway Certificate Public Key 최종 확인
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl x509 -in {{ gateway_tls_effective_cert_path | quote }} -pubkey -noout |
      openssl pkey -pubin -outform DER |
      sha256sum
    executable: /bin/bash
  register: gateway_tls_final_cert_public_key
  changed_when: false
  no_log: true

- name: Gateway Private Key Public Key 최종 확인
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl pkey -in {{ gateway_tls_effective_key_path | quote }} -pubout -outform DER |
      sha256sum
    executable: /bin/bash
  register: gateway_tls_final_key_public_key
  changed_when: false
  no_log: true

- name: Gateway Certificate / Private Key Pair 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_final_cert_public_key.stdout == gateway_tls_final_key_public_key.stdout
    fail_msg: "Gateway Certificate와 Private Key가 일치하지 않습니다."
  no_log: true

# ============================================================
# 2-1. External ACME Fullchain / System Trust 최종 검증
# - 실제 Kubernetes TLS Secret 변경 직전에 다시 검증한다.
# - gateway-certbot-verify production 실행 여부에 의존하지 않는다.
# ============================================================

- name: External ACME Leaf Certificate 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_external_cert_path }}"
    follow: true
  register: gateway_tls_external_cert
  when: gateway_tls_source == 'external_acme'

- name: External ACME Chain 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_external_chain_path }}"
    follow: true
  register: gateway_tls_external_chain
  when: gateway_tls_source == 'external_acme'

- name: System CA Bundle 확인
  ansible.builtin.stat:
    path: "{{ gateway_tls_system_ca_bundle_path }}"
    follow: true
  register: gateway_tls_system_ca_bundle
  when: gateway_tls_source == 'external_acme'

- name: External ACME Trust Chain 입력 계약 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_external_cert.stat.exists | default(false)
      - gateway_tls_external_cert.stat.isreg | default(false)
      - (gateway_tls_external_cert.stat.pw_name | default('')) == 'root'
      - gateway_tls_external_chain.stat.exists | default(false)
      - gateway_tls_external_chain.stat.isreg | default(false)
      - (gateway_tls_external_chain.stat.pw_name | default('')) == 'root'
      - gateway_tls_system_ca_bundle.stat.exists | default(false)
      - gateway_tls_system_ca_bundle.stat.isreg | default(false)
    fail_msg: >-
      External ACME cert/chain 또는 System CA Bundle이 준비되지 않았습니다.
      Kubernetes TLS Secret은 변경하지 않습니다.
  when: gateway_tls_source == 'external_acme'

- name: External ACME Fullchain 정합성 검증
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - |
        set -o pipefail
        cat "$1" "$2" | cmp -s - "$3"
      - _
      - "{{ gateway_tls_external_cert_path }}"
      - "{{ gateway_tls_external_chain_path }}"
      - "{{ gateway_tls_external_fullchain_path }}"
  changed_when: false
  when: gateway_tls_source == 'external_acme'

- name: External ACME System Trust Chain 검증
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -purpose
      - sslserver
      - -verify_hostname
      - "{{ gateway_tls_fqdn }}"
      - -CAfile
      - "{{ gateway_tls_system_ca_bundle_path }}"
      - -untrusted
      - "{{ gateway_tls_external_chain_path }}"
      - "{{ gateway_tls_external_cert_path }}"
  changed_when: false
  when: gateway_tls_source == 'external_acme'

# ============================================================
# 3. Kubernetes TLS Secret Desired State 수렴
# ============================================================

- name: Gateway Certificate 읽기
  ansible.builtin.slurp:
    src: "{{ gateway_tls_effective_cert_path }}"
  register: gateway_tls_cert_content
  no_log: true

- name: Gateway Private Key 읽기
  ansible.builtin.slurp:
    src: "{{ gateway_tls_effective_key_path }}"
  register: gateway_tls_key_content
  no_log: true

- name: 기존 Gateway TLS Secret 조회
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ gateway_tls_namespace }}"
    name: "{{ gateway_tls_secret_name }}"
  register: gateway_tls_secret_info
  changed_when: false
  no_log: true

- name: Gateway TLS Secret 존재 여부 결정
  ansible.builtin.set_fact:
    gateway_tls_secret_exists: "{{ gateway_tls_secret_info.resources | length == 1 }}"
  no_log: true

- name: Gateway TLS Secret 갱신 필요 여부 결정
  ansible.builtin.set_fact:
    gateway_tls_secret_needs_update: >-
      {{
        (not gateway_tls_secret_exists)
        or (
          gateway_tls_secret_exists
          and (
            (gateway_tls_secret_info.resources[0].type | default('')) != 'kubernetes.io/tls'
            or (gateway_tls_secret_info.resources[0].data['tls.crt'] | default('')) != gateway_tls_cert_content.content
            or (gateway_tls_secret_info.resources[0].data['tls.key'] | default('')) != gateway_tls_key_content.content
          )
        )
      }}
  no_log: true

- name: Gateway TLS Secret 생성 또는 갱신
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ cluster_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gateway_tls_secret_name }}"
        namespace: "{{ gateway_tls_namespace }}"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ gateway_tls_cert_content.content }}"
        tls.key: "{{ gateway_tls_key_content.content }}"
  when: gateway_tls_secret_needs_update
  no_log: true

- name: Gateway TLS Secret 최종 조회
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ gateway_tls_namespace }}"
    name: "{{ gateway_tls_secret_name }}"
  register: gateway_tls_secret_final
  changed_when: false
  no_log: true

- name: Gateway TLS Secret 최종 계약 검증
  ansible.builtin.assert:
    that:
      - gateway_tls_secret_final.resources | length == 1
      - gateway_tls_secret_final.resources[0].type == 'kubernetes.io/tls'
      - gateway_tls_secret_final.resources[0].data['tls.crt'] == gateway_tls_cert_content.content
      - gateway_tls_secret_final.resources[0].data['tls.key'] == gateway_tls_key_content.content
    fail_msg: "Gateway TLS Secret이 의도한 Certificate/Private Key로 수렴하지 않았습니다."
  no_log: true

# ============================================================
# 4. 비밀정보 없는 결과 요약
# ============================================================

- name: Gateway TLS Provider 결과 요약
  ansible.builtin.debug:
    msg:
      - "FQDN = {{ gateway_tls_fqdn }}"
      - "Namespace = {{ gateway_tls_namespace }}"
      - "Secret = {{ gateway_tls_secret_name }}"
      - "Secret Type = kubernetes.io/tls"
      - "Leaf Certificate 재발급 = {{ gateway_tls_needs_issue }}"
      - "Kubernetes Secret 갱신 = {{ gateway_tls_secret_needs_update }}"
      - "다음 Gate = seokpan-gitops#22 HTTPS Listener / NodePort / VIP Acceptance"
