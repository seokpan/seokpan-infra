---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: maxscale role default variables

# 06 문서에는 "24.02.10"으로 기재되어 있으나, 실서버 repo 확인 결과(#63)
# MaxScale 24.02 라인의 실제 최신(마지막) 패치는 24.02.9이며 24.02.10은
# 존재하지 않는 버전임을 확인함 (MariaDB 공식 릴리스 노트 기준).
# → 06 문서 오기로 판단, 실제 존재하는 최신 패치로 고정.
maxscale_version: "24.02.9-1.rhel.9"
maxscale_packages:
  - "maxscale-{{ maxscale_version }}"

# 실 서버(maxscale-01) history 확인 결과, 공식 mariadb_repo_setup 스크립트로
# --mariadb-maxscale-version 옵션을 주고 등록하는 방식.
# (MaxScale은 MariaDB Corporation이 배포하는 제품이라 AppStream/baseos에 존재하지 않음)
mariadb_maxscale_repo_version: "24.02"
mariadb_repo_setup_url: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
