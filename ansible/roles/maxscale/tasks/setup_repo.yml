---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: MariaDB 공식 repo 설정 스크립트로 mariadb-maxscale repo 등록 (idempotent, 버전 drift 감지)

# 실서버(maxscale-01) 테스트로 확인된 버그(#63): "repo가 켜져 있냐"만 확인하면
# 이미 다른 버전(예: 23.08)으로 등록된 상태에서 재등록(24.02로 전환)이 필요할 때도
# skip되어 버전이 그대로 남는 문제가 있었음. [mariadb-maxscale] 섹션 안에 목표
# 버전 문자열이 실제로 들어있는지까지 확인하도록 변경.
- name: mariadb-maxscale repo가 목표 버전으로 등록되어 있는지 확인
  ansible.builtin.shell:
    cmd: >
      awk '/^\[mariadb-maxscale\]/,/^\[/' /etc/yum.repos.d/mariadb.repo
      | grep -q "{{ mariadb_maxscale_repo_version }}"
  register: maxscale_repo_check
  changed_when: false
  failed_when: false

- name: MariaDB 공식 repo 설정 스크립트 다운로드
  ansible.builtin.get_url:
    url: "{{ mariadb_repo_setup_url }}"
    dest: /tmp/mariadb_repo_setup
    mode: "0755"
  when: maxscale_repo_check.rc != 0

- name: MariaDB/MaxScale repo 등록 (공식 스크립트 실행)
  ansible.builtin.command:
    cmd: "/tmp/mariadb_repo_setup --mariadb-maxscale-version={{ mariadb_maxscale_repo_version }}"
  when: maxscale_repo_check.rc != 0
