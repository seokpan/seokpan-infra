---
# 작성자: 최유준
# 작성 날짜: 08/28
#
# Role: argocd_bootstrap
# 범위: Argo CD 자체 설치, Root Application(App-of-Apps) 등록
# 소유권 경계: 설치 완료 후 Application Desired State는 Argo CD가 인수 (Ansible 재관리 X)
#
# 모든 태스크에 delegate_to: localhost — argocd_kubeconfig가 Ansible Controller
# 자체에 위치하므로, Controller에서 직접 kubernetes.core를 실행한다.

- name: Argo CD Namespace 존재 확인/생성 (멱등)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"
  delegate_to: localhost
  become: false

- name: Argo CD Release Manifest 다운로드
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ argocd_manifest_local_path }}"
    checksum: "{{ argocd_manifest_checksum | default(omit) }}"
    mode: "0644"
    force: false
  delegate_to: localhost
  become: false

# ============================================================
# 목적: install.yaml 전체 SSA가 argocd-cm.resource.exclusions를 매 실행마다
# upstream 기본값으로 되돌리고, 바로 다음 전용 patch 태스크(동일 field_manager)가
# 다시 프로젝트 값으로 되돌리는 순환 changed 제거 (리뷰 코멘트 반영)
# argocd-cm 리소스는 이후 전용 태스크가 단독 소유하도록 install manifest
# 적용 대상에서 제외한다.
# ============================================================
- name: install manifest 문서 목록 로드
  ansible.builtin.set_fact:
    argocd_install_docs_all: >-
      {{ (lookup('file', argocd_manifest_local_path) | from_yaml_all | list)
         | select('mapping') | list
         | rejectattr('kind', 'undefined') | list }}
  delegate_to: localhost
  become: false

- name: install manifest에서 argocd-cm·argocd-server Deployment 문서 제외 (필드 소유권 순환 방지)
  # argocd-cm: resource.exclusions 필드 순환 (#198 리뷰 반영, 기존 해결)
  # argocd-cmd-params-cm: server.insecure 필드 순환 (#117, 동일 원인으로 신규 추가)
  ansible.builtin.set_fact:
    argocd_install_docs_no_cm: >-
      {{ (argocd_install_docs_all
          | rejectattr('kind', 'in', ['ConfigMap', 'Deployment']) | list)
         + (argocd_install_docs_all | selectattr('kind', 'equalto', 'ConfigMap')
            | rejectattr('metadata.name', 'in', ['argocd-cm', 'argocd-cmd-params-cm']) | list)
         + (argocd_install_docs_all | selectattr('kind', 'equalto', 'Deployment')
            | rejectattr('metadata.name', 'equalto', 'argocd-server') | list) }}
  delegate_to: localhost
  become: false

- name: 필터링된 install manifest 임시 파일 준비
  ansible.builtin.tempfile:
    state: file
    prefix: "argocd-install-no-cm-"
    suffix: ".yaml"
  register: argocd_install_no_cm_temp
  delegate_to: localhost
  become: false

- name: 필터링된 install manifest 기록 (argocd-cm 제외본)
  ansible.builtin.copy:
    dest: "{{ argocd_install_no_cm_temp.path }}"
    content: "{{ argocd_install_docs_no_cm | map('to_nice_yaml') | join('---\n') }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: "Argo CD Manifest Server-Side Apply (argocd-cm 제외, 대형 CRD annotation 한도 회피)"
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    namespace: "{{ argocd_namespace }}"
    src: "{{ argocd_install_no_cm_temp.path }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
      force_conflicts: true
  register: argocd_apply_result
  delegate_to: localhost
  become: false

- name: 대형 CRD 정상 생성 확인 (262144 byte 이슈 재검증)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop: "{{ argocd_large_crds }}"
  register: argocd_large_crd_check
  failed_when: argocd_large_crd_check.resources | length == 0
  delegate_to: localhost
  become: false

- name: argocd-cmd-params-cm 원본 정의 추출 (install manifest 내 해당 문서만)
  ansible.builtin.set_fact:
    argocd_cmd_params_cm_original_def: >-
      {{ (lookup('file', argocd_manifest_local_path) | from_yaml_all | list)
         | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'ConfigMap')
         | selectattr('metadata.name', 'equalto', 'argocd-cmd-params-cm')
         | first }}
  delegate_to: localhost
  become: false

- name: "argocd-cmd-params-cm server.insecure 병합 SSA (#117)"
  # seokpan-gateway가 TLS를 Terminate 모드로 종료한 뒤 argocd-server에는 평문 HTTP로
  # 전달하는 구조(webhook 노출용)이므로, argocd-server가 평문 요청에 307 리다이렉트를
  # 돌려주지 않도록 server.insecure=true를 명시한다.
  # argocd-server Deployment 생성보다 먼저 적용 — env는 configMapKeyRef로 Pod 기동
  # 시점에만 주입되므로, 최초 bootstrap 시 이 순서를 지켜야 재시작 없이 정상 기동한다.
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
    definition: >-
      {{ argocd_cmd_params_cm_original_def
         | combine({
             'metadata': {'namespace': argocd_namespace},
             'data': {'server.insecure': 'true'}
           }, recursive=true) }}
  register: argocd_cmd_params_cm_apply_result
  delegate_to: localhost
  become: false

- name: argocd-server Deployment 원본 정의 추출 (install manifest 내 해당 문서만)
  ansible.builtin.set_fact:
    argocd_server_deploy_original_def: >-
      {{ (lookup('file', argocd_manifest_local_path) | from_yaml_all | list)
         | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'Deployment')
         | selectattr('metadata.name', 'equalto', 'argocd-server')
         | first }}
  delegate_to: localhost
  become: false

- name: "argocd-server Deployment spec.replicas 명시적 SSA 관리 (#198)"
  # install manifest 전체 SSA 대상에서 argocd-server Deployment를 제외했으므로
  # (위 argocd-cm·argocd-server 필터링 참고), 원본 정의를 그대로 재적용하지 않으면
  # 신규 클러스터 bootstrap 시 이 Deployment가 아예 생성되지 않는다.
  # replicas만 명시적으로 관리하고 나머지 spec/labels는 upstream 원본 그대로 유지.
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
      force_conflicts: true
    definition: >-
      {{ argocd_server_deploy_original_def
         | combine({
             'metadata': {'namespace': argocd_namespace},
             'spec': {'replicas': argocd_server_replicas}
           }, recursive=true) }}
  delegate_to: localhost
  become: false

- name: Argo CD 핵심 Deployment Ready 대기
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    kind: Deployment
    namespace: "{{ argocd_namespace }}"
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_ready_timeout }}"
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-applicationset-controller
  delegate_to: localhost
  become: false

- name: argocd-server 재시작 (server.insecure 변경 반영 — ConfigMap 변경은 실행 중 Pod에 자동 반영되지 않음)
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: patched
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  when: argocd_cmd_params_cm_apply_result.changed
  delegate_to: localhost
  become: false

- name: argocd-server 재시작 후 Ready 재대기
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    kind: Deployment
    namespace: "{{ argocd_namespace }}"
    name: argocd-server
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_ready_timeout }}"
  when: argocd_cmd_params_cm_apply_result.changed
  delegate_to: localhost
  become: false

- name: 필터링된 install manifest 임시 파일 제거
  ansible.builtin.file:
    path: "{{ argocd_install_no_cm_temp.path }}"
    state: absent
  delegate_to: localhost
  become: false

- name: argocd-cm 원본 정의 추출 (install manifest 내 해당 문서만)
  ansible.builtin.set_fact:
    argocd_cm_original_def: >-
      {{ (lookup('file', argocd_manifest_local_path) | from_yaml_all | list)
         | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'ConfigMap')
         | selectattr('metadata.name', 'equalto', 'argocd-cm')
         | first }}
  delegate_to: localhost
  become: false

- name: "argocd-cm resource.exclusions 병합 SSA (upstream 기본 data/labels 보존, #198 회귀 수정)"
  # 이전 방식(argocd-cm을 install manifest 적용 대상에서 완전히 제외 + resource.exclusions만
  # 담은 partial definition SSA)은 신규 클러스터 bootstrap 시 ignoreResourceUpdates 등
  # upstream 기본 data 키와 기본 labels가 생성되지 않는 회귀를 유발함 (재리뷰 지적).
  # install manifest에서 argocd-cm 원본 전체를 추출해 resource.exclusions 값만
  # combine으로 덮어쓴 완전한 정의를 SSA -> 나머지 data/labels는 upstream 원본 그대로 유지.
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
    definition: >-
      {{ argocd_cm_original_def
         | combine({
             'metadata': {'namespace': argocd_namespace},
             'data': {'resource.exclusions': argocd_cm_resource_exclusions_override}
           }, recursive=true) }}
  delegate_to: localhost
  become: false

- name: argocd-application-controller StatefulSet Ready 대기
  # StatefulSet은 Deployment의 Available Condition에 해당하는 표준 Ready Condition이
  # 없으므로, wait_condition 대신 until로 직접 확인한다.
  # readyReplicas는 spec.replicas(Desired Replica 수)와 비교해야 한다 — status.replicas는
  # 현재 관리 중인 Replica 수일 뿐이라, Scale-up 도중(예: spec=3, status=2, ready=2)에는
  # status.replicas 기준으로 오탐(false positive)이 발생할 수 있다. (리뷰 #141 반영)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    name: argocd-application-controller
    namespace: "{{ argocd_namespace }}"
  register: argocd_app_controller_sts_info
  until: >
    (argocd_app_controller_sts_info.resources | length > 0) and
    (argocd_app_controller_sts_info.resources[0].status.readyReplicas | default(0)) ==
    (argocd_app_controller_sts_info.resources[0].spec.replicas | default(1))
  retries: "{{ argocd_app_controller_ready_retries }}"
  delay: "{{ argocd_app_controller_ready_delay }}"
  delegate_to: localhost
  become: false

- name: argocd-application-controller StatefulSet 상태 출력 (Evidence 확인용)
  ansible.builtin.debug:
    msg: >-
      argocd-application-controller desiredReplicas={{ argocd_app_controller_sts_info.resources[0].spec.replicas }}
      readyReplicas={{ argocd_app_controller_sts_info.resources[0].status.readyReplicas | default(0) }}

- name: Root Application 배포 (임시 Manifest 생성 → 적용 → 정리)
  when: not ansible_check_mode
  block:
    - name: Root Application 임시 Manifest 파일 생성
      ansible.builtin.tempfile:
        state: file
        prefix: "root-application-{{ argocd_namespace }}-"
        suffix: ".yaml"
      register: root_application_manifest_temp
      delegate_to: localhost
      become: false

    - name: Root Application Manifest 생성
      ansible.builtin.template:
        src: root-application.yaml.j2
        dest: "{{ root_application_manifest_temp.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Root Application 등록/갱신
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        src: "{{ root_application_manifest_temp.path }}"
        state: present
        apply: true
        server_side_apply:
          field_manager: "{{ argocd_field_manager }}"
          force_conflicts: true
      register: root_app_apply_result
      delegate_to: localhost
      become: false

    - name: Root Application 임시 Manifest 제거
      ansible.builtin.file:
        path: "{{ root_application_manifest_temp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Root Application Synced/Healthy 확인
      kubernetes.core.k8s_info:
        kubeconfig: "{{ argocd_kubeconfig }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ root_application_name }}"
        namespace: "{{ argocd_namespace }}"
      register: root_app_info
      until: >
        (root_app_info.resources | length > 0) and
        (root_app_info.resources[0].status.sync.status | default('')) == 'Synced' and
        (root_app_info.resources[0].status.health.status | default('')) == 'Healthy'
      retries: "{{ root_app_sync_retries }}"
      delay: "{{ root_app_sync_delay }}"
      delegate_to: localhost
      become: false

    - name: Root Application 상태 출력 (Evidence 확인용)
      ansible.builtin.debug:
        msg: >-
          root Application sync={{ root_app_info.resources[0].status.sync.status }}
          health={{ root_app_info.resources[0].status.health.status }}
