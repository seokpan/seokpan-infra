---
# 작성자: 최유준
# 작성 날짜: 08/28
#
# Role: argocd_bootstrap
# 범위: Argo CD 자체 설치, Root Application(App-of-Apps) 등록
# 소유권 경계: 설치 완료 후 Application Desired State는 Argo CD가 인수 (Ansible 재관리 X)
#
# 모든 태스크에 delegate_to: localhost — argocd_kubeconfig가 Ansible Controller
# 자체에 위치하므로, Controller에서 직접 kubernetes.core를 실행한다.

- name: Argo CD Namespace 존재 확인/생성 (멱등)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"
  delegate_to: localhost
  become: false

- name: Argo CD Release Manifest 다운로드
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ argocd_manifest_local_path }}"
    checksum: "{{ argocd_manifest_checksum | default(omit) }}"
    mode: "0644"
    force: false
  delegate_to: localhost
  become: false

- name: "Argo CD Manifest Server-Side Apply (대형 CRD annotation 한도 회피, 재검증 대상)"
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    namespace: "{{ argocd_namespace }}"
    src: "{{ argocd_manifest_local_path }}"
    state: present
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
      force_conflicts: true
  register: argocd_apply_result
  delegate_to: localhost
  become: false

- name: argocd-cm resource.exclusions에서 EndpointSlice 제외 해제 (Endpoints는 유지) 
  # upstream install.yaml(v3.4.7) 기본값에 discovery.k8s.io/EndpointSlice가 포함되어 있어,
  # 외부 VM Exporter용으로 수동 생성한 EndpointSlice(observability/servicemonitor-external-exporters.yaml)가
  # ArgoCD의 추적/Sync/Diff 대상에서 완전히 제외되는 문제 해결.
  # apiGroups: ['', 'discovery.k8s.io'] / kinds: [Endpoints, EndpointSlice] 항목만
  # Endpoints 단독으로 축소하고, 나머지 upstream 기본 exclusions(Lease, Authn/Authz,
  # CertificateSigningRequest/CertificateRequest, Cilium, Kyverno)는 그대로 유지.
  # 동일 field_manager("{{ argocd_field_manager }}")로 SSA하여 초기 설치 apply와
  # 필드 소유권 충돌 없이 병합됨.
  kubernetes.core.k8s:
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present
    server_side_apply:
      field_manager: "{{ argocd_field_manager }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        namespace: "{{ argocd_namespace }}"
      data:
        resource.exclusions: |
          ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
          - apiGroups:
              - ''
            kinds:
              - Endpoints
          ### Internal Kubernetes resources excluded reduce the number of watched events
          - apiGroups:
              - coordination.k8s.io
            kinds:
              - Lease
          ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
          - apiGroups:
              - authentication.k8s.io
              - authorization.k8s.io
            kinds:
              - SelfSubjectReview
              - TokenReview
              - LocalSubjectAccessReview
              - SelfSubjectAccessReview
              - SelfSubjectRulesReview
              - SubjectAccessReview
          ### Intermediate Certificate Request excluded reduce the number of watched events
          - apiGroups:
              - certificates.k8s.io
            kinds:
              - CertificateSigningRequest
          - apiGroups:
              - cert-manager.io
            kinds:
              - CertificateRequest
          ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
          - apiGroups:
              - cilium.io
            kinds:
              - CiliumIdentity
              - CiliumEndpoint
              - CiliumEndpointSlice
          ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
          - apiGroups:
              - kyverno.io
              - reports.kyverno.io
              - wgpolicyk8s.io
            kinds:
              - PolicyReport
              - ClusterPolicyReport
              - EphemeralReport
              - ClusterEphemeralReport
              - AdmissionReport
              - ClusterAdmissionReport
              - BackgroundScanReport
              - ClusterBackgroundScanReport
              - UpdateRequest
        resource.customizations.ignoreDifferences.discovery.k8s.io_EndpointSlice: |
          jqPathExpressions:
            - .endpoints[].conditions
  delegate_to: localhost
  become: false
  register: argocd_cm_exclusions_patch

- name: 대형 CRD 정상 생성 확인 (262144 byte 이슈 재검증)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop: "{{ argocd_large_crds }}"
  register: argocd_large_crd_check
  failed_when: argocd_large_crd_check.resources | length == 0
  delegate_to: localhost
  become: false

- name: Argo CD 핵심 Deployment Ready 대기
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    kind: Deployment
    namespace: "{{ argocd_namespace }}"
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_ready_timeout }}"
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-applicationset-controller
  delegate_to: localhost
  become: false

# ============================================================
# 작성자: 최유준
# 작성 날짜: 2026/09/16
# 목적: argocd-application-controller StatefulSet Ready Validation 추가 (#141)
# ============================================================
- name: argocd-application-controller StatefulSet Ready 대기
  # StatefulSet은 Deployment의 Available Condition에 해당하는 표준 Ready Condition이
  # 없으므로, wait_condition 대신 until로 직접 확인한다.
  # readyReplicas는 spec.replicas(Desired Replica 수)와 비교해야 한다 — status.replicas는
  # 현재 관리 중인 Replica 수일 뿐이라, Scale-up 도중(예: spec=3, status=2, ready=2)에는
  # status.replicas 기준으로 오탐(false positive)이 발생할 수 있다. (리뷰 #141 반영)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ argocd_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    name: argocd-application-controller
    namespace: "{{ argocd_namespace }}"
  register: argocd_app_controller_sts_info
  until: >
    (argocd_app_controller_sts_info.resources | length > 0) and
    (argocd_app_controller_sts_info.resources[0].status.readyReplicas | default(0)) ==
    (argocd_app_controller_sts_info.resources[0].spec.replicas | default(1))
  retries: "{{ argocd_app_controller_ready_retries }}"
  delay: "{{ argocd_app_controller_ready_delay }}"
  delegate_to: localhost
  become: false

- name: argocd-application-controller StatefulSet 상태 출력 (Evidence 확인용)
  ansible.builtin.debug:
    msg: >-
      argocd-application-controller desiredReplicas={{ argocd_app_controller_sts_info.resources[0].spec.replicas }}
      readyReplicas={{ argocd_app_controller_sts_info.resources[0].status.readyReplicas | default(0) }}

- name: Root Application 배포 (임시 Manifest 생성 → 적용 → 정리)
  when: not ansible_check_mode
  block:
    - name: Root Application 임시 Manifest 파일 생성
      ansible.builtin.tempfile:
        state: file
        prefix: "root-application-{{ argocd_namespace }}-"
        suffix: ".yaml"
      register: root_application_manifest_temp
      delegate_to: localhost
      become: false

    - name: Root Application Manifest 생성
      ansible.builtin.template:
        src: root-application.yaml.j2
        dest: "{{ root_application_manifest_temp.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Root Application 등록/갱신
      kubernetes.core.k8s:
        kubeconfig: "{{ argocd_kubeconfig }}"
        src: "{{ root_application_manifest_temp.path }}"
        state: present
        server_side_apply:
          field_manager: "{{ argocd_field_manager }}"
          force_conflicts: true
      register: root_app_apply_result
      delegate_to: localhost
      become: false

    - name: Root Application 임시 Manifest 제거
      ansible.builtin.file:
        path: "{{ root_application_manifest_temp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Root Application Synced/Healthy 확인
      kubernetes.core.k8s_info:
        kubeconfig: "{{ argocd_kubeconfig }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ root_application_name }}"
        namespace: "{{ argocd_namespace }}"
      register: root_app_info
      until: >
        (root_app_info.resources | length > 0) and
        (root_app_info.resources[0].status.sync.status | default('')) == 'Synced' and
        (root_app_info.resources[0].status.health.status | default('')) == 'Healthy'
      retries: "{{ root_app_sync_retries }}"
      delay: "{{ root_app_sync_delay }}"
      delegate_to: localhost
      become: false

    - name: Root Application 상태 출력 (Evidence 확인용)
      ansible.builtin.debug:
        msg: >-
          root Application sync={{ root_app_info.resources[0].status.sync.status }}
          health={{ root_app_info.resources[0].status.health.status }}
