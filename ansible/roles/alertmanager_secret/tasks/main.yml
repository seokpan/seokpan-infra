# 작성자: 최유준
# 작성 날짜: 2026-09-15
#
# alertmanager-smtp-credential: Alertmanager가 Resend SMTP로 이메일을 발송하기 위한
# Credential. GitOps(seokpan-gitops)는 Receiver의 host/port/from/username(고정 문자열
# "resend")만 소유하고, 이 API Key(비밀값)만 Ansible이 별도 Secret으로 주입한다
# (jenkins_secrets의 harbor-api-credential과 동일 소유권 분리 패턴, 06 문서 4.1 기준).
# GitOps는 이 Secret을 AlertmanagerSpec.secrets로 마운트하여 참조한다
# (/etc/alertmanager/secrets/alertmanager-smtp-credential/smtp-password).
# 기존 Alertmanager 설정 Secret(alertmanager-config)이 alertmanager.yaml을
# 계속 소유하며, 이 Credential Secret으로 대체되지 않는다.
#
# [실행 전제] observability Namespace 및 kube-prometheus-stack Alertmanager StatefulSet은
# 이미 배포·가동 중(alertmanager-kube-prometheus-stack-alertmanager-0, 8d 기준 Running)이므로
# jenkins_secrets의 cicd Namespace bootstrap 순서 제약과 달리 별도 선행 순서 조건 없음.

- name: 필수 Vault 변수 정의 여부 확인
  ansible.builtin.assert:
    that:
      - vault_alertmanager_resend_api_key is defined
    fail_msg: "vault_alertmanager_resend_api_key가 정의되지 않았습니다. group_vars/all/vault.yml 확인 필요"
  delegate_to: localhost
  become: false

- name: alertmanager-smtp-credential Secret 적용
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: alertmanager-smtp-credential
        namespace: observability
      stringData:
        smtp-password: "{{ vault_alertmanager_resend_api_key }}"
  register: alertmanager_smtp_credential_apply
  delegate_to: localhost
  become: false
  no_log: true

- name: alertmanager-smtp-credential 생성 결과 확인
  ansible.builtin.assert:
    that:
      - alertmanager_smtp_credential_apply is succeeded
    fail_msg: "alertmanager-smtp-credential 생성/갱신 실패"
  when: not ansible_check_mode

- name: 생성된 Secret 확인
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Secret
    namespace: observability
    name: alertmanager-smtp-credential
  register: alertmanager_secret_summary
  delegate_to: localhost
  become: false
  no_log: true

- name: 결과 요약 출력
  ansible.builtin.debug:
    msg: >-
      {{ alertmanager_secret_summary.resources | length }}
