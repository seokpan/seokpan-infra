# 작성자: 최유준
# 작성 날짜: 2026-09-18
#
# argocd-secret.data["webhook.github.secret"]: GitHub Webhook Payload의
# X-Hub-Signature-256 서명 검증에 쓰이는 Shared Secret.
# 이 값이 설정되지 않으면 argocd-server는 서명 검증 없이 Webhook Payload를
# 그대로 처리하므로 (unauthenticated trigger 가능), Gateway route가
# 공개되기 전에 반드시 먼저 적용되어야 한다 (seokpan-gitops PR 리뷰 코멘트 반영).
#
# argocd-secret은 ArgoCD 자신이 admin.password/server.secretkey/tls.*를
# 런타임에 소유·관리하는 Secret이므로, 이 role은 전체를 덮어쓰지 않고
# webhook.github.secret 필드만 병합(JSON merge patch)한다.
# (alertmanager_secret role과 동일 소유권 분리 패턴 — 06 문서 4.1 기준)
#
# [실행 전제] argocd-secret은 이미 존재(argocd_bootstrap role이 최초 생성).
# 이 role은 그 Secret에 필드를 추가하는 후속 작업이며 argocd 네임스페이스가
# 이미 Running 상태임을 전제로 한다.

- name: 필수 Vault 변수 정의 여부 확인
  ansible.builtin.assert:
    that:
      - vault_argocd_webhook_github_secret is defined
    fail_msg: "vault_argocd_webhook_github_secret가 정의되지 않았습니다. inventory/group_vars/all/vault.yml 확인 필요"
  delegate_to: localhost
  become: false

- name: 적용 전 argocd-secret 기존 필드 목록 확인 (증거 보존용)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Secret
    namespace: argocd
    name: argocd-secret
  register: argocd_secret_before
  delegate_to: localhost
  become: false
  no_log: true

- name: argocd-secret에 webhook.github.secret 필드 병합
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: argocd-secret
        namespace: argocd
      stringData:
        webhook.github.secret: "{{ vault_argocd_webhook_github_secret }}"
  register: argocd_webhook_secret_apply
  delegate_to: localhost
  become: false
  no_log: true

- name: 적용 결과 확인
  ansible.builtin.assert:
    that:
      - argocd_webhook_secret_apply is succeeded
    fail_msg: "argocd-secret webhook.github.secret 병합 실패"
  when: not ansible_check_mode

- name: 적용 후 argocd-secret 필드 목록 확인 (기존 필드 보존 증명용)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Secret
    namespace: argocd
    name: argocd-secret
  register: argocd_secret_after
  delegate_to: localhost
  become: false
  no_log: true

- name: 기존 필드(admin.password 등) 보존 여부 확인
  ansible.builtin.assert:
    that:
      - "'admin.password' in argocd_secret_after.resources[0].data"
      - "'server.secretkey' in argocd_secret_after.resources[0].data"
      - "'tls.crt' in argocd_secret_after.resources[0].data"
      - "'webhook.github.secret' in argocd_secret_after.resources[0].data"
    fail_msg: "기존 필드가 손실되었거나 webhook.github.secret이 반영되지 않았습니다"
  when: not ansible_check_mode

- name: 결과 요약 출력
  ansible.builtin.debug:
    msg: >-
      argocd-secret 필드 병합 전: {{ argocd_secret_before.resources[0].data.keys() | list }},
      병합 후: {{ argocd_secret_after.resources[0].data.keys() | list }}
