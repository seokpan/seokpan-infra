---
# Application Runtime이 Harbor Private Image를 Pull하기 위한 전용 Robot Account.
# 기존 CI Push/Pull 및 Image Pipeline API Robot과 Credential/권한을 공유하지 않는다.

- name: Harbor Project ID 조회 (Application Runtime Pull Robot용)
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/projects?name={{ harbor_project_name }}"
    method: GET
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: true
    status_code: 200
  register: _harbor_runtime_pull_project_lookup
  changed_when: false
  check_mode: false
  no_log: true

- name: Harbor Project ID 확정 (Application Runtime Pull Robot용)
  ansible.builtin.set_fact:
    _harbor_runtime_pull_project_id: >-
      {{ (_harbor_runtime_pull_project_lookup.json
          | selectattr('name', 'equalto', harbor_project_name)
          | map(attribute='project_id')
          | first) }}

- name: Harbor Project ID 검증 (Application Runtime Pull Robot용)
  ansible.builtin.assert:
    that:
      - _harbor_runtime_pull_project_id is defined
      - (_harbor_runtime_pull_project_id | string | length) > 0
    fail_msg: >-
      Harbor Project '{{ harbor_project_name }}'의 project_id를 확인할 수 없습니다.

- name: Harbor Robot Account 목록 조회 (Application Runtime Pull Robot용)
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/robots?q=Level%3Dproject%2CProjectID%3D{{ _harbor_runtime_pull_project_id }}&page_size=100"
    method: GET
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: true
    status_code: 200
  register: _harbor_runtime_pull_robots
  changed_when: false
  check_mode: false
  no_log: true

- name: 기존 Application Runtime Pull Robot 조회 결과 확정
  ansible.builtin.set_fact:
    _harbor_runtime_pull_robot_matches: >-
      {{ _harbor_runtime_pull_robots.json
         | selectattr('name', 'equalto', 'robot$' + harbor_project_name + '+' + harbor_runtime_pull_robot_name)
         | list }}

- name: Application Runtime Pull Robot 중복 여부 검증
  ansible.builtin.assert:
    that:
      - (_harbor_runtime_pull_robot_matches | length) <= 1
    fail_msg: >-
      같은 이름의 Application Runtime Pull Robot이 둘 이상 조회됐습니다. 자동 변경하지 않습니다.

- name: 기존 Application Runtime Pull Robot 권한 검증
  ansible.builtin.assert:
    that:
      - (_harbor_runtime_pull_robot_matches[0].permissions | length) == 1
      - not (_harbor_runtime_pull_robot_matches[0].disable | default(true) | bool)
      - _harbor_runtime_pull_robot_matches[0].expires_at is defined
      - (_harbor_runtime_pull_robot_matches[0].expires_at | default(0) | int) == -1
      - _harbor_runtime_pull_robot_matches[0].permissions[0].kind == 'project'
      - _harbor_runtime_pull_robot_matches[0].permissions[0].namespace == harbor_project_name
      - (_harbor_runtime_pull_robot_matches[0].permissions[0].access | length) == 1
      - _harbor_runtime_pull_robot_matches[0].permissions[0].access[0].resource == 'repository'
      - _harbor_runtime_pull_robot_matches[0].permissions[0].access[0].action == 'pull'
    fail_msg: >-
      기존 Application Runtime Pull Robot의 활성·무기한·repository:pull 전용 계약이 다릅니다.
      자동 수정하거나 재생성하지 않습니다.
  when: (_harbor_runtime_pull_robot_matches | length) == 1

- name: 기존 Application Runtime Pull Robot Secret 인계 상태 판정
  ansible.builtin.set_fact:
    _harbor_runtime_pull_vault_secret_available: >-
      {{ (vault_harbor_runtime_pull_secret | default('') | string | length) > 0 }}
  when: (_harbor_runtime_pull_robot_matches | length) == 1
  no_log: true

- name: 기존 Application Runtime Pull Robot Secret 인계 상태 검증
  ansible.builtin.assert:
    that:
      - _harbor_runtime_pull_vault_secret_available | bool
    fail_msg: >-
      기존 Application Runtime Pull Robot은 유효하지만
      vault_harbor_runtime_pull_secret이 없습니다. Harbor가 생성 시 한 번만 제공한
      Secret은 다시 조회할 수 없으므로 자동 삭제·재생성하지 않습니다.
      담당자 확인 후 명시적으로 Robot을 재발급하고 새 Secret을 Vault에 등록하세요.
  when: (_harbor_runtime_pull_robot_matches | length) == 1

- name: Application Runtime Pull Robot 생성 (Repository Pull 전용)
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/robots"
    method: POST
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: true
    body_format: json
    body:
      name: "{{ harbor_runtime_pull_robot_name }}"
      disable: false
      duration: -1
      description: >-
        application Namespace의 Backend/Frontend Runtime Image Pull 전용 계정.
        Jenkins Build/Push 및 Harbor REST API 작업에는 사용하지 않음.
      level: project
      permissions:
        - kind: project
          namespace: "{{ harbor_project_name }}"
          access:
            - resource: repository
              action: pull
    status_code: 201
  register: _harbor_new_runtime_pull_robot
  when:
    - not ansible_check_mode
    - (_harbor_runtime_pull_robot_matches | length) == 0
  no_log: true

- name: 신규 Application Runtime Pull Robot Secret 응답 검증
  ansible.builtin.assert:
    that:
      - _harbor_new_runtime_pull_robot.json.secret is defined
      - (_harbor_new_runtime_pull_robot.json.secret | string | length) > 0
    fail_msg: >-
      신규 Robot은 생성됐지만 1회성 Secret을 받지 못했습니다. 자동 재시도하지 않습니다.
  when:
    - not ansible_check_mode
    - (_harbor_runtime_pull_robot_matches | length) == 0
  no_log: true

- name: 신규 Application Runtime Pull Robot Secret 처리
  when:
    - not ansible_check_mode
    - (_harbor_runtime_pull_robot_matches | length) == 0
  block:
    - name: Application Runtime Pull Robot 임시 Secret 파일 생성
      ansible.builtin.tempfile:
        state: file
        suffix: "_harbor_runtime_pull_robot_secret"
      register: _harbor_runtime_pull_secret_tempfile
      delegate_to: localhost
      become: false

    - name: Application Runtime Pull Robot Secret 임시 기록
      ansible.builtin.copy:
        content: "{{ _harbor_new_runtime_pull_robot.json.secret }}"
        dest: "{{ _harbor_runtime_pull_secret_tempfile.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Application Runtime Pull Robot Secret Vault 등록 안내
      ansible.builtin.debug:
        msg: >-
          Robot Account 생성 완료. Secret 값은 출력하지 않았습니다.
          {{ _harbor_runtime_pull_secret_tempfile.path }}의 값을
          vault_harbor_runtime_pull_secret 이름으로 Vault에 암호화 등록하세요.
          Robot Name: robot${{ harbor_project_name }}+{{ harbor_runtime_pull_robot_name }}

    - name: Application Runtime Pull Robot Secret Vault 등록 완료 대기
      ansible.builtin.pause:
        prompt: >-
          Vault 등록을 완료했으면 Enter를 누르세요. 임시 파일을 즉시 삭제합니다
      delegate_to: localhost
      become: false
  always:
    - name: Application Runtime Pull Robot 임시 Secret 파일 정리
      ansible.builtin.file:
        path: "{{ _harbor_runtime_pull_secret_tempfile.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: >-
        _harbor_runtime_pull_secret_tempfile is defined
        and _harbor_runtime_pull_secret_tempfile.path is defined
