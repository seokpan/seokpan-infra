# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [위치] 기존 ~/seokpan-infra/ansible/roles/harbor/tasks/ 안에 robot_account.yml로 추가,
# main.yml에서 include_tasks로 연결 (Project 생성 이후, GC 정책 설정 이전 정도 위치 권장).
#
# [범위] 06 문서 "7.1 Harbor 설치: 최소 권한 Robot Account 생성(Push/Pull 범위만)",
# 11 Runbook "자동화 적용 범위: Harbor 설치·Project·Robot Account·GC | Ansible(harbor Role)" 반영.
#
# [권한 범위 결정] seokpan Project 한정, Push+Pull만. Robot Account는 프로젝트 삭제/설정 변경 등의
# 권한을 갖지 않음 (Harbor v2.x Robot Account는 기본적으로 Project 범위 + 세부 Action 선택 가능).
#
# [멱등성 주의] Harbor API로 Robot Secret은 생성 시점에 딱 한 번만 응답에 포함되고,
# 이후 조회로는 다시 얻을 수 없습니다. 그래서 이 Task는:
#   1) 동일 이름의 Robot Account가 이미 있는지 먼저 조회
#   2) 있으면 생성을 건너뛰고 "이미 존재함, Secret은 Vault에 이미 있어야 함" 안내만 출력
#   3) 없으면 새로 생성하고, 그 즉시 화면에 1회성 안내로만 노출 (no_log로 Ansible 로그/Evidence에는 안 남김)
#      → 이후 사람이 수동으로 ansible-vault encrypt_string으로 group_vars/all/vault.yml에 추가
#
# [TODO] Harbor Admin 인증 정보는 admin 계정 고정(Harbor 기본 관리자, 변경 불가) +
# 기존 harbor role이 쓰는 harbor_admin_password 변수 그대로 재사용.
#
# [선행 조건] harbor_project.yml이 먼저 실행되어 Project가 존재해야 함 (main.yml에서 순서 주의:
# harbor_project.yml → robot_account.yml 순).

# [API 경로 수정, 08/28] Harbor v2 API에는 /api/v2.0/projects/{project}/robots 경로가
# 없습니다 (404 확인됨). Robot Account는 /api/v2.0/robots (전체 목록)로 조회하고
# 이름으로 필터링해야 합니다.

- name: Harbor Robot Account 전체 목록 조회
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/robots"
    method: GET
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 409]
  register: _harbor_existing_robots
  changed_when: false
  check_mode: false
  no_log: true   # 응답 자체에 민감정보는 없지만 습관적으로 최소 노출 원칙 적용

- name: 기존 Robot Account 이름 목록 추출
  ansible.builtin.set_fact:
    _harbor_robot_exists: >-
      {{ _harbor_existing_robots.json
         | selectattr('name', 'search', harbor_robot_name)
         | list | length > 0 }}
  # [주의] Harbor의 Robot 전체 이름 형식(robot$<project>+<name> 등)이 버전/설정에 따라
  # 다를 수 있어서 정확한 등호 매칭 대신 이름에 harbor_robot_name이 포함되는지로 느슨하게 확인합니다.
  # 실행 후 실제 이름 형식이 다르면 이 필터를 조정해야 할 수 있습니다.

- name: Robot Account가 이미 존재하면 재생성하지 않고 안내만 출력
  ansible.builtin.debug:
    msg: >-
      Robot Account 'robot${{ harbor_robot_name }}'가 이미 존재합니다.
      Secret은 최초 생성 시에만 노출되므로, group_vars/all/vault.yml에
      vault_harbor_robot_secret 값이 이미 등록되어 있는지 확인하세요.
      (없다면 Harbor UI에서 기존 Robot을 삭제하고 이 Task를 재실행해야 새 Secret을 받을 수 있습니다.)
  when: _harbor_robot_exists

- name: Robot Account 생성 (Push/Pull 권한만, seokpan Project 한정)
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/api/v2.0/robots"
    method: POST
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ harbor_robot_name }}"
      duration: -1   # 만료 없음. 순환(rotation) 정책은 별도 결정 필요 - 지금은 임의로 정하지 않음
      description: "seokpan CI/CD pipeline - Jenkins push/pull only"
      level: project
      permissions:
        - kind: project
          namespace: "{{ harbor_project_name }}"
          access:
            - resource: repository
              action: push
            - resource: repository
              action: pull
    status_code: [201, 409]
  register: _harbor_new_robot
#  no_log: true   # 응답 body에 1회성 secret이 포함되므로 로그/Evidence에 절대 남기지 않음
  when: not _harbor_robot_exists

- name: 신규 생성된 Robot Secret을 화면에 1회 안내 (로그에는 남지 않음)
  ansible.builtin.debug:
    msg: >-
      Robot Account 생성 완료. 아래 값을 지금 바로 복사해서
      'ansible-vault encrypt_string --vault-password-file <경로> "<SECRET>" --name vault_harbor_robot_secret'
      명령으로 암호화한 뒤 group_vars/all/vault.yml에 추가하세요. 이 화면을 벗어나면 다시 볼 수 없습니다.
      Robot Name: robot${{ harbor_robot_name }}
      Robot Secret: {{ _harbor_new_robot.json.secret }}
  when: not _harbor_robot_exists and _harbor_new_robot.json.secret is defined   # ← 안전장치 추가
  no_log: false
