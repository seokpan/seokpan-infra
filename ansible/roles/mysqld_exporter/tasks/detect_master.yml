---
# Determine the current MariaDB Master through MaxScale.
# Account DDL is executed only on the current Master.

- name: maxctrl list servers 조회
  ansible.builtin.command: maxctrl --tsv list servers
  delegate_to: "{{ mysqld_exporter_master_delegate_host }}"
  run_once: true
  changed_when: false
  check_mode: false
  register: mysqld_exporter_maxctrl_result

- name: State 컬럼에 Master가 포함된 서버명 추출
  ansible.builtin.set_fact:
    mysqld_exporter_master_candidates: >-
      {{ mysqld_exporter_maxctrl_result.stdout_lines
         | select('search', 'Master')
         | map('regex_replace', '^([^\t]+)\t.*$', '\1')
         | list }}
  run_once: true

- name: Master가 정확히 1개인지 검증
  ansible.builtin.assert:
    that:
      - mysqld_exporter_master_candidates | length == 1
    fail_msg: >-
      Master 서버가 0개 또는 여러 개로 조회되었습니다:
      {{ mysqld_exporter_master_candidates }}
      (maxctrl list servers 원본 출력을 직접 확인할 것)
  run_once: true

- name: Master 호스트명을 mariadbs 그룹 전체에 공유
  ansible.builtin.set_fact:
    mysqld_exporter_master_inventory_hostname: "{{ mysqld_exporter_master_candidates[0] }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['mariadbs'] }}"
  run_once: true
