---
# Owner: 김상희
# Scope: Data, Storage & Recovery / Observability
# Project: 石나가는 판단
# Purpose: mysqld_exporter role entrypoint

- name: ansible.mariadb 모듈 요구사항(PyMySQL) 설치
  ansible.builtin.dnf:
    name: python3-PyMySQL
    state: present

- name: 실제 MariaDB Master 서버 판별
  ansible.builtin.import_tasks: detect_master.yml

- name: exporter_svc 계정 및 권한 구성
  ansible.builtin.import_tasks: account.yml

- name: mysqld_exporter 설치 및 서비스 구성
  ansible.builtin.import_tasks: install.yml
