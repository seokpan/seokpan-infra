---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: Ansible + cron 스케줄 실행 방식 확정 (이슈 #55 코멘트 결정사항)

- name: MariaDB Full 백업 cron 등록
  ansible.builtin.cron:
    name: "seokpan mariadb full backup"
    minute: "{{ backup_transfer_cron_minute }}"
    hour: "{{ backup_transfer_cron_hour }}"
    job: "{{ backup_transfer_script_path }} >> {{ backup_transfer_log_dir }}/mariadb_backup_cron.log 2>&1"
    user: root
