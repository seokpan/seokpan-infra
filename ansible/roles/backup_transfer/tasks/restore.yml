---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: 대상 백업 경로가 결정된 이후의 복구 실행 자동화 (이슈 #55 코멘트 결정사항)
#          - 어떤 백업으로/언제 복구할지 판단은 사람이 하고, backup_restore_source_dir로 넘긴다
#          - 이 task는 그 이후의 --copy-back → 권한 복원 → 기동 → 표본 검증만 자동화한다

- name: 필수 변수 확인
  ansible.builtin.assert:
    that:
      - backup_restore_source_dir is defined
      - backup_restore_source_dir | length > 0
    fail_msg: >-
      backup_restore_source_dir(복구에 사용할 백업 경로)를 extra-vars로 반드시 지정할 것.
      예: -e backup_restore_source_dir=/srv/nfs/db-backup/full_20260903_020000

- name: 기존 복구 작업 디렉터리 정리
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ backup_restore_target_dir }}"
    - "{{ backup_restore_working_dir }}"

- name: 복구 대상/작업 디렉터리 준비
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0750"
  loop:
    - "{{ backup_restore_target_dir }}"
    - "{{ backup_restore_working_dir }}"

- name: 백업본을 작업 디렉터리로 복사 (원본 백업본 보존을 위한 워킹 카피)
  ansible.builtin.command: >
    rsync -a --delete {{ backup_restore_source_dir }}/ {{ backup_restore_working_dir }}/
  changed_when: true

- name: mariadb-backup --copy-back 실행
  ansible.builtin.command: >
    mariadb-backup --copy-back
    --target-dir={{ backup_restore_working_dir }}
    --datadir={{ backup_restore_target_dir }}
  changed_when: true

- name: 데이터 디렉터리 소유권 복원
  ansible.builtin.file:
    path: "{{ backup_restore_target_dir }}"
    state: directory
    owner: mysql
    group: mysql
    recurse: true

- name: 격리 인스턴스 systemd unit 배포
  ansible.builtin.template:
    src: mariadb-restore.service.j2
    dest: /etc/systemd/system/mariadb-restore.service
    mode: "0644"
  notify: restore systemd daemon reload

- name: systemd daemon-reload 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: 격리 인스턴스 기동
  ansible.builtin.systemd:
    name: mariadb-restore
    state: restarted
    enabled: false

- name: 인스턴스 기동 대기 (소켓 파일 생성 확인)
  ansible.builtin.wait_for:
    path: "{{ backup_restore_socket }}"
    timeout: 60

- name: 표본 테이블 Row Count 조회 (복구 인스턴스)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ backup_restore_socket }}"
    login_user: root
    query: "SELECT COUNT(*) AS cnt FROM {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  register: backup_restore_counts

- name: 운영 Master 표본 Row Count 조회 (비교 기준)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ mariadb_socket_path }}"
    login_user: root
    query: "SELECT COUNT(*) AS cnt FROM {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  delegate_to: "{{ mariadb_master_inventory_hostname }}"
  register: backup_restore_live_counts

- name: PK/Count 일치 여부 비교 결과 출력
  ansible.builtin.debug:
    msg: >-
      {{ item.0.item }}: 복구본={{ item.0.query_result[0][0].cnt }},
      운영본={{ item.1.query_result[0][0].cnt }},
      일치={{ item.0.query_result[0][0].cnt == item.1.query_result[0][0].cnt }}
  loop: "{{ backup_restore_counts.results | zip(backup_restore_live_counts.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

