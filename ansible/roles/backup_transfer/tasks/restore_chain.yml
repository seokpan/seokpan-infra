# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: chain_<타임스탬프> 디렉터리(Full+Incremental N개)를 롤포워드 병합해
#          단일 Full 복구와 동일한 형태로 만든 뒤, 이후 검증까지 수행 (이슈 #114)
#          - restore.yml과 달리 호출하지 않고 --copy-back 이후 로직을 자체 포함함:
#            SHA256SUMS는 롤포워드 "이전"(raw 상태) 기준으로 계산되어 있어, 롤포워드
#            이후(--prepare로 파일 내용이 바뀐 상태) 디렉터리를 restore.yml에 그대로
#            넘기면 무결성 검증이 무조건 실패하기 때문 (설계 노트: 이슈 #114 코멘트)
#          - 롤포워드 절차: --apply-log-only는 MariaDB 10.1 전용이며 10.2 이후(본
#            프로젝트 11.8.9 포함) 완전히 제거됨(실서버 검증 중 unknown option 확인,
#            2026-09-03) — Full을 먼저 단독 --prepare한 뒤 각 Incremental을 순서대로
#            --incremental-dir로 반복 --prepare하는 절차로 단순화

- name: 단일 호스트 대상 여부 확인 (파괴적 작업 안전장치)
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
    fail_msg: >-
      이 playbook은 반드시 -l 옵션으로 정확히 1개 호스트를 지정해서 실행해야 합니다.
      현재 대상: {{ ansible_play_hosts_all }}

- name: 필수 변수 확인
  ansible.builtin.assert:
    that:
      - backup_restore_chain_dir is defined
      - backup_restore_chain_dir | length > 0
    fail_msg: >-
      backup_restore_chain_dir(복구할 체인 디렉터리명)를 extra-vars로 반드시 지정할 것.
      예: -e backup_restore_chain_dir=chain_20260907_020000

- name: 기존 체인 복구 작업 디렉터리 정리
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ backup_restore_target_dir }}"
    - "{{ backup_restore_chain_working_dir }}"

- name: 체인 복구 작업 디렉터리 준비
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0750"
  loop:
    - "{{ backup_restore_target_dir }}"
    - "{{ backup_restore_chain_working_dir }}"

- name: NFS 백업 경로에서 체인 전체를 작업 디렉터리로 복사 (원본 보존을 위한 워킹 카피)
  ansible.builtin.command: >
    rsync -a --delete {{ backup_transfer_nfs_mount_point }}/{{ backup_restore_chain_dir }}/
    {{ backup_restore_chain_working_dir }}/
  changed_when: true

- name: 체인 구성요소(full_*, incr_*) 타임스탬프 순 목록 조회
  ansible.builtin.find:
    paths: "{{ backup_restore_chain_working_dir }}"
    file_type: directory
    patterns: "full_*,incr_*"
  register: backup_restore_chain_entries

- name: 체인 구성요소가 1개 이상(Full 최소 1개)인지 확인
  ansible.builtin.assert:
    that:
      - backup_restore_chain_entries.files | length >= 1
    fail_msg: "체인 디렉터리({{ backup_restore_chain_dir }})에서 full_*/incr_* 디렉터리를 찾지 못했습니다."

- name: 구성요소를 이름(타임스탬프) 순으로 정렬 (full_ 이 항상 가장 먼저 오도록 이름 규칙에 의존)
  ansible.builtin.set_fact:
    backup_restore_chain_sorted: >-
      {{ backup_restore_chain_entries.files
         | map(attribute='path')
         | map('basename')
         | sort
         | list }}

- name: 정렬 결과 첫 항목이 full_ 인지 확인 (체인 무결성 — Full 없이는 복구 불가)
  ansible.builtin.assert:
    that:
      - backup_restore_chain_sorted[0] is match('^full_')
    fail_msg: >-
      체인의 첫 구성요소가 Full 백업이 아닙니다: {{ backup_restore_chain_sorted[0] }}
      (Full 없이는 이 체인을 복구할 수 없습니다.)

- name: 각 구성요소 무결성 검증 (SHA256SUMS — 롤포워드 이전 raw 상태 기준)
  ansible.builtin.command: sha256sum -c SHA256SUMS
  args:
    chdir: "{{ backup_restore_chain_working_dir }}/{{ item }}"
  loop: "{{ backup_restore_chain_sorted }}"
  changed_when: false

- name: 롤포워드 — Full 베이스 Prepare (자체 redo log 동기화)
  # 실서버 검증(2026-09-03) 중 발견: --apply-log-only는 MariaDB 10.1 전용 옵션이며
  # 10.2 이후(본 프로젝트 11.8.9 포함) 완전히 제거되어 지원하지 않음(unknown option
  # 에러). 10.2+ 공식 절차는 --apply-log-only 구분 없이, Full을 먼저 단독 --prepare한
  # 뒤 각 Incremental을 순서대로 --incremental-dir로 반복 적용하는 것으로 단순화됨.
  ansible.builtin.command: >
    mariadb-backup --prepare
    --target-dir={{ backup_restore_chain_working_dir }}/{{ backup_restore_chain_sorted[0] }}
  changed_when: true

- name: 롤포워드 — Incremental 순차 병합 (구성요소가 2개 이상일 때만)
  ansible.builtin.command: >
    mariadb-backup --prepare
    --target-dir={{ backup_restore_chain_working_dir }}/{{ backup_restore_chain_sorted[0] }}
    --incremental-dir={{ backup_restore_chain_working_dir }}/{{ item }}
  loop: "{{ backup_restore_chain_sorted[1:] }}"
  changed_when: true

# --- 이 시점부터는 restore.yml의 --copy-back 이후 로직과 동일 (의도적 중복 —
#     롤포워드 이전 SHA256SUMS 기준 검증과 섞이지 않도록 restore.yml을 호출하지 않음) ---

- name: mariadb-backup --copy-back 실행 (롤포워드 완료된 Full 디렉터리 기준)
  ansible.builtin.command: >
    mariadb-backup --copy-back
    --target-dir={{ backup_restore_chain_working_dir }}/{{ backup_restore_chain_sorted[0] }}
    --datadir={{ backup_restore_target_dir }}
  changed_when: true

- name: 데이터 디렉터리 소유권 복원
  ansible.builtin.file:
    path: "{{ backup_restore_target_dir }}"
    state: directory
    owner: mysql
    group: mysql
    recurse: true

- name: 격리 인스턴스 systemd unit 배포
  ansible.builtin.template:
    src: mariadb-restore.service.j2
    dest: /etc/systemd/system/mariadb-restore.service
    mode: "0644"
  notify: restore systemd daemon reload

- name: systemd daemon-reload 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: 격리 인스턴스 기동
  ansible.builtin.systemd:
    name: mariadb-restore
    state: restarted
    enabled: false

- name: 인스턴스 기동 대기 (소켓 파일 생성 확인)
  ansible.builtin.wait_for:
    path: "{{ backup_restore_socket }}"
    timeout: 60

- name: 표본 테이블 Row Count 조회 (복구 인스턴스)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ backup_restore_socket }}"
    login_user: root
    query: "SELECT COUNT(*) AS cnt FROM {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  register: backup_restore_counts

- name: 표본 테이블 Row Count 조회 (운영 Master, 비교 기준)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ mariadb_socket_path }}"
    login_user: root
    query: "SELECT COUNT(*) AS cnt FROM {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  delegate_to: "{{ mariadb_master_inventory_hostname }}"
  register: backup_restore_live_counts

- name: Count 일치 여부 Gate
  ansible.builtin.assert:
    that:
      - item.0.query_result[0][0].cnt == item.1.query_result[0][0].cnt
    fail_msg: >-
      {{ item.0.item }} Count 불일치: 복구본={{ item.0.query_result[0][0].cnt }},
      운영본={{ item.1.query_result[0][0].cnt }}
    success_msg: >-
      {{ item.0.item }} Count 일치: {{ item.0.query_result[0][0].cnt }}
  loop: "{{ backup_restore_counts.results | zip(backup_restore_live_counts.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

- name: 표본 테이블 CHECKSUM 조회 (복구 인스턴스, PK 포함 전체 행 내용 검증)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ backup_restore_socket }}"
    login_user: root
    query: "CHECKSUM TABLE {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  register: backup_restore_checksums

- name: 표본 테이블 CHECKSUM 조회 (운영 Master, 비교 기준)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ mariadb_socket_path }}"
    login_user: root
    query: "CHECKSUM TABLE {{ stone_game_db }}.{{ item }}"
  loop: "{{ backup_restore_validation_tables }}"
  delegate_to: "{{ mariadb_master_inventory_hostname }}"
  register: backup_restore_live_checksums

- name: PK 일치 여부 Gate (테이블 CHECKSUM 비교 — 행 유실/중복/변조까지 탐지)
  ansible.builtin.assert:
    that:
      - item.0.query_result[0][0].Checksum == item.1.query_result[0][0].Checksum
    fail_msg: >-
      {{ item.0.item }} CHECKSUM 불일치(PK/행 데이터 상이): 복구본={{ item.0.query_result[0][0].Checksum }},
      운영본={{ item.1.query_result[0][0].Checksum }}
    success_msg: >-
      {{ item.0.item }} CHECKSUM 일치: {{ item.0.query_result[0][0].Checksum }}
  loop: "{{ backup_restore_checksums.results | zip(backup_restore_live_checksums.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

- name: FK 참조 무결성 조회 (복구 인스턴스 — 고아 행 존재 여부)
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ backup_restore_socket }}"
    login_user: root
    query: >-
      SELECT COUNT(*) AS orphan_cnt FROM {{ stone_game_db }}.{{ item.table }} t
      WHERE t.{{ item.column }} IS NOT NULL
        AND NOT EXISTS (
          SELECT 1 FROM {{ stone_game_db }}.{{ item.ref_table }} r
          WHERE r.{{ item.ref_column }} = t.{{ item.column }}
        )
  loop: "{{ backup_restore_fk_checks }}"
  loop_control:
    label: "{{ item.table }}.{{ item.column }} -> {{ item.ref_table }}.{{ item.ref_column }}"
  register: backup_restore_fk_orphans

- name: FK 무결성 Gate (고아 행 0건이어야 통과)
  ansible.builtin.assert:
    that:
      - item.query_result[0][0].orphan_cnt == 0
    fail_msg: >-
      {{ item.item.table }}.{{ item.item.column }} -> {{ item.item.ref_table }}.{{ item.item.ref_column }}
      참조 무결성 위반: 고아 행 {{ item.query_result[0][0].orphan_cnt }}건
    success_msg: >-
      {{ item.item.table }}.{{ item.item.column }} -> {{ item.item.ref_table }}.{{ item.item.ref_column }}
      참조 무결성 정상 (고아 행 0건)
  loop: "{{ backup_restore_fk_orphans.results }}"
  loop_control:
    label: "{{ item.item.table }}.{{ item.item.column }}"
