---
# ============================================================
# 기존 Harbor Host 매핑 정리
# ============================================================

- name: Remove legacy Harbor host mappings
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^192\.168\.53\.61\s+harbor\.stone\.test\s+harbor\s*$'
    - '^192\.168\.53\.61\s+harbor\.seokpan\.soldesk\.store\s*$'


# ============================================================
# 운영 Alias + 공식 Endpoint 렌더링
# - Jinja trim/lstrip 설정과 무관하게 line list를 만든 뒤 join('\n')한다.
# ============================================================

- name: Initialize project host line list
  ansible.builtin.set_fact:
    common_hosts_managed_lines: []

- name: Append operational host aliases
  ansible.builtin.set_fact:
    common_hosts_managed_lines: >-
      {{ common_hosts_managed_lines + [item.ip ~ ' ' ~ item.alias] }}
  loop: "{{ common_host_entries }}"
  loop_control:
    label: "{{ item.alias }}"

- name: Append published project endpoints
  ansible.builtin.set_fact:
    common_hosts_managed_lines: >-
      {{
        common_hosts_managed_lines
        + [
            item.value.address
            ~ ' '
            ~ item.value.fqdn
            ~ (
                (' ' ~ (item.value.host_aliases | default([]) | join(' ')))
                if (item.value.host_aliases | default([]) | length > 0)
                else ''
              )
          ]
      }}
  loop: "{{ project_endpoints | dict2items }}"
  loop_control:
    label: "{{ item.value.fqdn }}"
  when: item.value.host_publish | default(false)

- name: Verify project host lines are structurally valid
  ansible.builtin.assert:
    that:
      - common_hosts_managed_lines | length > 0
      - common_hosts_managed_lines | select('search', '\\n') | list | length == 0
      - common_hosts_managed_lines | select('equalto', '') | list | length == 0
    fail_msg: "Rendered /etc/hosts line list is invalid. Refusing to modify /etc/hosts."


# ============================================================
# /etc/hosts에 운영 Alias + 공식 Endpoint 등록
# ============================================================

- name: Configure project host aliases and endpoints
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED PROJECT HOST ALIASES"
    block: "{{ common_hosts_managed_lines | join('\n') }}"
    state: present
    create: true


# ============================================================
# 적용된 /etc/hosts 확인
# ============================================================

- name: Read project host aliases
  ansible.builtin.command:
    cmd: cat /etc/hosts
  register: common_hosts_result
  changed_when: false
  check_mode: false


# ============================================================
# 결과 출력
# ============================================================

- name: Display project host aliases
  ansible.builtin.debug:
    var: common_hosts_result.stdout_lines
