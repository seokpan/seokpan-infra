---
# ============================================================
# 기존 Harbor Host 매핑 정리
# ============================================================

- name: Remove legacy Harbor host mappings
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^192\.168\.53\.61\s+harbor\.stone\.test\s+harbor\s*$'
    - '^192\.168\.53\.61\s+harbor\.seokpan\.soldesk\.store\s*$'


# ============================================================
# /etc/hosts에 운영 Alias + 공식 Endpoint 등록
# ============================================================

- name: Configure project host aliases and endpoints
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED PROJECT HOST ALIASES"
    block: |
      {% for host in common_host_entries %}
      {{ host.ip }} {{ host.alias }}
      {% endfor %}
      {% for endpoint in project_endpoints | dict2items %}
      {% if endpoint.value.host_publish | default(false) %}
      {{ endpoint.value.address }} {{ endpoint.value.fqdn }}{% for alias in endpoint.value.host_aliases | default([]) %} {{ alias }}{% endfor %}
      {% endif %}
      {% endfor %}
    state: present
    create: true


# ============================================================
# 적용된 /etc/hosts 확인
# ============================================================

- name: Read project host aliases
  ansible.builtin.command:
    cmd: cat /etc/hosts
  register: common_hosts_result
  changed_when: false
  check_mode: false


# ============================================================
# 결과 출력
# ============================================================

- name: Display project host aliases
  ansible.builtin.debug:
    var: common_hosts_result.stdout_lines
