# 작성자: 최유준
# 작성 날짜: 2026-09-15 (2026-09-15 3차 수정: block/always로 실패 경로 Cleanup 보장)
#
# Infra #179 완료 기준 중 미충족 항목(DNS resolve smtp.resend.com → TCP 587 →
# STARTTLS handshake)을 검증하는 Preflight Role.
#
# [설계 이력]
# 1) 최초 설계는 kubectl debug로 실제 Alertmanager Pod에 Ephemeral Container를
#    붙이는 방식이었으나, Ansible Controller에 kubectl CLI가 없어 실패(Errno 2).
#    kubernetes.core(Python Client, kubectl 불요)만으로 검증하기 위해, 운영 Pod
#    대신 독립 라벨을 가진 일회성 Job을 observability namespace에 띄우는 방식으로 전환.
# 2) Job 라벨을 Alertmanager와 동일하게(app.kubernetes.io/name: alertmanager) 두려
#    했으나, alertmanager-operated Headless Service(Prometheus Operator 자동 생성,
#    Gossip Mesh용, publishNotReadyAddresses: true)가 그 라벨 하나만으로 Endpoint를
#    선택하는 구조라 운영 클러스터 Mesh에 끼어들 위험 발견 → app: smtp-preflight
#    독립 라벨 + 전용 임시 NetworkPolicy(allow-smtp-preflight-egress-smtp) 방식으로 재설계.
# 3) kind/name만으로 조회·삭제하는 태스크에서 api_version 생략 시 기본값 v1(core
#    group)로 리졸브되어 NetworkPolicy/Job 조회 실패 발견 → 전체 태스크에 api_version 명시.
# 4) [PR #189 리뷰 반영] assert(Job 성공 여부, 로그 패턴)가 실패하면 Ansible Play가
#    그 자리에서 중단되어 뒤에 있던 Job/NetworkPolicy 삭제 태스크에 도달하지 못하는
#    문제 발견. Job은 ttlSecondsAfterFinished로 자연 정리되지만 NetworkPolicy는
#    TTL이 없어 검증 실패 시 클러스터에 영구 잔존할 수 있었음. 검증 실패 자체는
#    여전히 Play 실패로 유지하되, Cleanup만은 성공/실패 무관하게 실행되도록
#    block/always 구조로 전환.
#
# [확인 필요] observability namespace의 Alertmanager Service selector는 PR #189
# 검토 시점(2026-09-15)에 kube-prometheus-stack-alertmanager(alertmanager +
# app.kubernetes.io/name 복합 라벨 요구)와 alertmanager-operated(app.kubernetes.io/name
# 단일 라벨) 두 개로 확인됨 — app: smtp-preflight 라벨은 둘 중 어느 것과도 겹치지 않음.

- name: 필수 변수 정의 여부 확인
  ansible.builtin.assert:
    that:
      - cluster_kubeconfig is defined
    fail_msg: "cluster_kubeconfig가 정의되지 않았습니다."
  delegate_to: localhost
  become: false

- name: 기존 Preflight Job 잔존 여부 확인 (재실행 대비)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Job
    api_version: batch/v1
    namespace: observability
    name: alertmanager-smtp-preflight
  register: preflight_existing_job
  delegate_to: localhost
  become: false

- name: 기존 Preflight Job 삭제 (재실행 시 이름 충돌 방지)
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Job
    api_version: batch/v1
    namespace: observability
    name: alertmanager-smtp-preflight
    state: absent
    wait: true
  when:
    - preflight_existing_job.resources | length > 0
    - not ansible_check_mode
  delegate_to: localhost
  become: false

- name: --check 모드 안내 (이 Role은 --check 미지원, 실제 실행 필요)
  ansible.builtin.debug:
    msg: >-
      --check 모드에서는 Job/NetworkPolicy 생성과 이후 확인 태스크가 모두
      skip됩니다. 이 Role은 순수 진단 작업이라 --check 없이 바로 실행하면
      됩니다: ansible-playbook alertmanager_smtp_preflight.yml
  when: ansible_check_mode

- name: 기존 임시 NetworkPolicy 잔존 여부 확인 (재실행 대비)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: NetworkPolicy
    api_version: networking.k8s.io/v1
    namespace: observability
    name: allow-smtp-preflight-egress-smtp
  register: preflight_existing_netpol
  delegate_to: localhost
  become: false

- name: 기존 임시 NetworkPolicy 삭제 (재실행 시 충돌 방지)
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: NetworkPolicy
    api_version: networking.k8s.io/v1
    namespace: observability
    name: allow-smtp-preflight-egress-smtp
    state: absent
  when:
    - preflight_existing_netpol.resources | length > 0
    - not ansible_check_mode
  delegate_to: localhost
  become: false

# [PR #189 리뷰 반영] NetworkPolicy/Job 생성부터 검증 assert까지를 block으로
# 묶고, 성공/실패 여부와 무관하게 always에서 Cleanup을 보장한다. always는
# 에러를 삼키지 않으므로 검증 실패 시 Play는 여전히 실패로 끝난다 — 달라지는
# 건 "실패해도 Cleanup은 반드시 실행된다"는 점뿐이다.
- name: SMTP Preflight 검증 (실패해도 Cleanup 보장)
  when: not ansible_check_mode
  block:
    - name: Preflight 전용 임시 NetworkPolicy 생성
      # allow-alertmanager-egress-smtp(observability/networkpolicy-observability.yaml
      # 정책 6)와 동일한 Egress 규칙을 독립 라벨(app: smtp-preflight)에만 복제 적용.
      # 운영 Alertmanager Pod/Service selector와 절대 겹치지 않는 라벨을 사용.
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster_kubeconfig }}"
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-smtp-preflight-egress-smtp
            namespace: observability
          spec:
            podSelector:
              matchLabels:
                app: smtp-preflight
            policyTypes:
              - Egress
            egress:
              - to:
                  - ipBlock:
                      cidr: 0.0.0.0/0
                ports:
                  - protocol: TCP
                    port: 587
                  - protocol: TCP
                    port: 465
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
      register: preflight_netpol_apply

    - name: SMTP Preflight Job 생성 (전용 라벨, 운영 Alertmanager와 분리)
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster_kubeconfig }}"
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: alertmanager-smtp-preflight
            namespace: observability
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app: smtp-preflight
                  job-name: alertmanager-smtp-preflight
              spec:
                restartPolicy: Never
                containers:
                  - name: smtp-preflight
                    image: nicolaka/netshoot
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "=== DNS ==="
                        dig +short smtp.resend.com
                        echo "=== TCP ==="
                        nc -vz -w 5 smtp.resend.com 587
                        echo "=== STARTTLS ==="
                        echo QUIT | openssl s_client -starttls smtp -connect smtp.resend.com:587 -brief
      register: preflight_job_apply

    - name: Job 완료 대기 (성공/실패 무관, 종료까지)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster_kubeconfig }}"
        kind: Job
        api_version: batch/v1
        namespace: observability
        name: alertmanager-smtp-preflight
      register: preflight_job_status
      until: >
        (preflight_job_status.resources[0].status.succeeded | default(0)) > 0
        or (preflight_job_status.resources[0].status.failed | default(0)) > 0
      retries: 24
      delay: 5

    - name: Preflight Pod 이름 조회
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster_kubeconfig }}"
        kind: Pod
        api_version: v1
        namespace: observability
        label_selectors:
          - "job-name=alertmanager-smtp-preflight"
      register: preflight_pod_lookup

    - name: Preflight 로그 조회
      kubernetes.core.k8s_log:
        kubeconfig: "{{ cluster_kubeconfig }}"
        namespace: observability
        name: "{{ preflight_pod_lookup.resources[0].metadata.name }}"
      register: preflight_log

    - name: Job 성공 여부 확인
      ansible.builtin.assert:
        that:
          - (preflight_job_status.resources[0].status.succeeded | default(0)) > 0
        fail_msg: >-
          SMTP Preflight 실패(Job failed). 로그: {{ preflight_log.log | default('로그 조회 실패') }}

    - name: DNS/TCP/STARTTLS 결과 패턴 확인
      ansible.builtin.assert:
        that:
          - "'=== TCP ===' in preflight_log.log"
          - "'succeeded' in preflight_log.log or 'open' in preflight_log.log"
          - "'Verification: OK' in preflight_log.log or 'Verify return code: 0' in preflight_log.log"
        fail_msg: >-
          Preflight 로그에서 기대한 성공 패턴을 찾지 못했습니다. 전체 로그: {{ preflight_log.log }}

    - name: 진단 결과 전체 로그 출력
      ansible.builtin.debug:
        msg: "{{ preflight_log.log_lines | default(preflight_log.log) }}"

  always:
    # 검증 성공/실패 무관하게 항상 실행. Job/NetworkPolicy가 아직 생성되지
    # 않은 단계(block 초반 실패)에서도 k8s state:absent는 이미 없는 리소스에
    # 대해 no-op으로 안전하게 처리되므로 존재 여부 조건 없이 그대로 호출한다.
    - name: Preflight Job 정리 (always)
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster_kubeconfig }}"
        kind: Job
        api_version: batch/v1
        namespace: observability
        name: alertmanager-smtp-preflight
        state: absent
        wait: false
      delegate_to: localhost
      become: false

    - name: Preflight 전용 임시 NetworkPolicy 정리 (always)
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster_kubeconfig }}"
        kind: NetworkPolicy
        api_version: networking.k8s.io/v1
        namespace: observability
        name: allow-smtp-preflight-egress-smtp
        state: absent
        wait: false
      delegate_to: localhost
      become: false
