---
- name: 필수 Vault 변수 존재 확인
  ansible.builtin.assert:
    that:
      - maxscale_exporter_password is defined
      - maxscale_rest_admin_password is defined
    quiet: true
  no_log: true

- name: maxscale_exporter REST API 유저 존재 여부 조회 (ID 정확 조회)
  ansible.builtin.uri:
    url: "{{ maxscale_exporter_rest_url }}/users/inet/{{ maxscale_exporter_rest_username }}"
    method: GET
    url_username: "{{ maxscale_exporter_rest_admin_user }}"
    url_password: "{{ maxscale_rest_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: maxscale_exporter_user_check
  changed_when: false
  check_mode: false
  no_log: true

- name: maxscale_exporter REST API 유저 생성 (없을 때만, 비밀번호는 argv가 아닌 HTTP body로 전달)
  ansible.builtin.uri:
    url: "{{ maxscale_exporter_rest_url }}/users/inet"
    method: POST
    url_username: "{{ maxscale_exporter_rest_admin_user }}"
    url_password: "{{ maxscale_rest_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      data:
        id: "{{ maxscale_exporter_rest_username }}"
        type: inet
        attributes:
          password: "{{ maxscale_exporter_password }}"
          account: basic
    status_code: [201, 204]
  when: maxscale_exporter_user_check.status == 404
  changed_when: true
  no_log: true