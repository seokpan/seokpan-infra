---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: mariadb_user role default variables (이슈 #89)
#          repl_user / maxscale_monitor / backup_svc 계정 코드화
#          (identity_svc/game_svc/db_admin은 mariadb_account role — 이슈 #91)

# 계정/DCL 작업은 항상 실제 Master에서만 수행 (E_infra_snapshot.md 2절)
mariadb_master_delegate_host: maxscale-01

# RHEL 계열 MariaDB 공식 repo 패키지 기준 기본 소켓 경로.
# 실제 경로가 다르면 --check --diff 전에 아래 값을 override할 것.
mariadb_socket_path: /var/lib/mysql/mysql.sock

# --- E_infra_snapshot.md 6절 실측(SHOW GRANTS) 그대로 반영 ---

# repl_user: 전역 REPLICATION SLAVE만 (변경 없음)
repl_user_priv: "*.*:REPLICATION SLAVE"

# maxscale_monitor: 전역 다수 권한 + mysql.* SELECT
# (mysql.user/procs_priv/columns_priv/tables_priv/db/proxies_priv 개별 SELECT는
#  mysql_query로 별도 처리 — priv 문자열이 동일 스키마 내 * 와 개별 테이블을
#  함께 표현하는 것을 신뢰성 있게 지원하지 않음, game_svc 컬럼 GRANT와 동일한 이유)
maxscale_monitor_priv: >-
  *.*:RELOAD,PROCESS,SHOW DATABASES,SUPER,REPLICATION SLAVE,BINLOG MONITOR,SET USER,FEDERATED ADMIN,CONNECTION ADMIN,READ_ONLY ADMIN,REPLICATION SLAVE ADMIN,REPLICATION MASTER ADMIN,BINLOG ADMIN,BINLOG REPLAY,SLAVE MONITOR/mysql.*:SELECT

# SHOW GRANTS 실측 기준 mysql 스키마 개별 테이블 SELECT 목록
maxscale_monitor_extra_grant_tables:
  - user
  - procs_priv
  - columns_priv
  - tables_priv
  - db
  - proxies_priv

# backup_svc(신규): mariadb-backup(xtrabackup 계열) 실행에 필요한 최소 권한만.
# host는 localhost 한정 (원격 접속 불필요, 백업은 로컬에서 실행)
backup_svc_host: localhost
backup_svc_priv: "*.*:RELOAD,PROCESS,LOCK TABLES,REPLICATION CLIENT"
