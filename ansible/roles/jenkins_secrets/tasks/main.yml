# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [위치] harbor role이 아니라 별도 위치 권장 — Harbor는 VM 대상 role이고 이 Task는
# Kubernetes Cluster 대상이라 성격이 다름. stage 70-platform.yml에서, Jenkins 네임스페이스가
# 이미 존재하는 시점(Argo CD가 apps/root 통해 jenkins 네임스페이스 Sync한 이후) 이후에 실행.
#
# [원칙, 06 문서 4.1] "Kubernetes Secret의 실제 값은 Ansible이 최초 주입하거나 승인된 Secret
# 전달 절차가 주입하며, Argo CD는 Secret 참조만 관리한다." — 그래서 이 Secret들은
# seokpan-gitops repo에 커밋하지 않고, Ansible이 kubectl로 클러스터에 직접 적용합니다.
# Jenkins Deployment/JCasC(Git에 있음)는 이 Secret의 "이름"만 참조합니다.
#
# [kubectl 사용 이유] kubernetes.core 사용은 팀 requirements.yml/txt 확정 전까지 보류 원칙
# (argocd_bootstrap role과 동일한 판단 기준 적용) — command 모듈로 kubectl 직접 호출.
#
# [주의, 08/28] harbor_hostname / harbor_robot_name은 group_vars/harbor/vars.yml에 정의되어
# harbor 그룹(호스트) 대상 Play에서만 자동으로 보입니다. 이 Task는 K8s 대상 Play에서 실행되므로
# hostvars['harbor'].변수명 형태로 명시적으로 끌어옵니다 (인벤토리 상의 실제 호스트/그룹명이
# "harbor"가 맞는지 확인 필요 — 다르면 아래 hostvars['harbor'] 부분을 실제 이름으로 교체).
#
# [멱등성] kubectl 재실행 시 동일 값으로 덮어써도 안전하도록 `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` 패턴 사용.

# 작성자: 최유준
# 작성 날짜: 2026-09-02
#
# [위치] harbor role이 아니라 별도 위치 — Harbor는 VM 대상 role이고 이 Task는
# Kubernetes Cluster 대상이라 성격이 다름. stage 70-platform.yml에서, cicd Namespace가
# 이미 존재하는 시점(Root Application이 platform/namespaces-rbac 통해 공용 5종 Namespace를
# Sync한 이후) 이후에 실행.
#
# [원칙, 06 문서 4.1] "Kubernetes Secret의 실제 값은 Ansible이 최초 주입하거나 승인된 Secret
# 전달 절차가 주입하며, Argo CD는 Secret 참조만 관리한다." — 그래서 이 Secret들은
# seokpan-gitops repo에 커밋하지 않고, Ansible이 kubernetes.core.k8s로 클러스터에 직접 적용합니다.
# Jenkins Deployment/JCasC(Git에 있음)는 이 Secret의 "이름"만 참조합니다.
#
# [수정 이력, 09/02] PR #98 리뷰 반영: cp-03 고정 + shell kubectl 방식을
# Ansible Controller + kubernetes.core.k8s(공용 cluster_kubeconfig, argocd_bootstrap과 동일 패턴)
# 방식으로 전환. 사유: kubernetes.core는 kubectl 바이너리가 아니라 Python client 기반이라
# Controller에 kubectl 설치 없이도 delegate_to: localhost로 동작 가능(기존 09/02 comment의
# "Controller에 kubectl 없어 불가"라는 전제는 오판이었음). 부수적으로 shell 이중 렌더링으로 인해
# harbor_robot_name의 리터럴 "$" 문자가 bash 변수로 오인식되던 버그도 함께 해소됨.
# jenkins-admin Secret 생성 task는 유지(Jenkins Controller 필수 admin 계정).

- name: 필수 Vault 변수 정의 여부 확인
  ansible.builtin.assert:
    that:
      - vault_harbor_robot_secret is defined
      - vault_jenkins_admin_username is defined
      - vault_jenkins_admin_password is defined
    fail_msg: "필수 vault 변수가 정의되지 않았습니다. group_vars/all/vault.yml 확인 필요"
  delegate_to: localhost
  become: false

- name: jenkins-admin Secret 적용 (Jenkins Controller 최초 관리자 계정)
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: jenkins-admin
        namespace: cicd
      stringData:
        username: "{{ vault_jenkins_admin_username }}"
        password: "{{ vault_jenkins_admin_password }}"
  register: jenkins_admin_secret_apply
  delegate_to: localhost
  become: false
  no_log: true

- name: harbor-robot-dockerconfig Secret 적용 (BuildKit rootless Agent Pod가 마운트)
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: harbor-robot-dockerconfig
        namespace: cicd
      data:
        .dockerconfigjson: >-
          {{
            {
              'auths': {
                hostvars['harbor'].harbor_hostname: {
                  'username': 'robot$' ~ hostvars['harbor'].harbor_project_name ~ '+' ~ hostvars['harbor'].harbor_robot_name,
                  'password': vault_harbor_robot_secret,
                  'auth': (('robot$' ~ hostvars['harbor'].harbor_project_name ~ '+' ~ hostvars['harbor'].harbor_robot_name ~ ':' ~ vault_harbor_robot_secret) | b64encode)
                }
              }
            } | to_json | b64encode
          }}
  register: harbor_dockerconfig_secret_apply
  delegate_to: localhost
  become: false
  no_log: true

- name: jenkins-harbor-credential Secret 적용 (JCasC 환경변수 치환용, Jenkins Credential Store 바인딩)
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: jenkins-harbor-credential
        namespace: cicd
      stringData:
        username: "robot${{ hostvars['harbor'].harbor_project_name }}+{{ hostvars['harbor'].harbor_robot_name }}"
        password: "{{ vault_harbor_robot_secret }}"
  register: jenkins_harbor_credential_secret_apply
  delegate_to: localhost
  become: false
  no_log: true

- name: 생성된 Secret 목록 확인 (요약)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_kubeconfig }}"
    kind: Secret
    namespace: cicd
    name: "{{ item }}"
  loop:
    - jenkins-admin
    - harbor-robot-dockerconfig
    - jenkins-harbor-credential
  register: jenkins_secrets_summary
  delegate_to: localhost
  become: false
  no_log: true

- name: 결과 요약 출력
  ansible.builtin.debug:
    msg: >-
      {{ jenkins_secrets_summary.results
         | map(attribute='resources')
         | map('length')
         | list }}
    # 각 Secret이 조회되면 1, 없으면 0 — 3개 모두 1이어야 정상
