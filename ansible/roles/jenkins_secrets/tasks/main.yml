# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [위치] harbor role이 아니라 별도 위치 권장 — Harbor는 VM 대상 role이고 이 Task는
# Kubernetes Cluster 대상이라 성격이 다름. stage 70-platform.yml에서, Jenkins 네임스페이스가
# 이미 존재하는 시점(Argo CD가 apps/root 통해 jenkins 네임스페이스 Sync한 이후) 이후에 실행.
#
# [원칙, 06 문서 4.1] "Kubernetes Secret의 실제 값은 Ansible이 최초 주입하거나 승인된 Secret
# 전달 절차가 주입하며, Argo CD는 Secret 참조만 관리한다." — 그래서 이 Secret들은
# seokpan-gitops repo에 커밋하지 않고, Ansible이 kubectl로 클러스터에 직접 적용합니다.
# Jenkins Deployment/JCasC(Git에 있음)는 이 Secret의 "이름"만 참조합니다.
#
# [kubectl 사용 이유] kubernetes.core 사용은 팀 requirements.yml/txt 확정 전까지 보류 원칙
# (argocd_bootstrap role과 동일한 판단 기준 적용) — command 모듈로 kubectl 직접 호출.
#
# [주의, 08/28] harbor_hostname / harbor_robot_name은 group_vars/harbor/vars.yml에 정의되어
# harbor 그룹(호스트) 대상 Play에서만 자동으로 보입니다. 이 Task는 K8s 대상 Play에서 실행되므로
# hostvars['harbor'].변수명 형태로 명시적으로 끌어옵니다 (인벤토리 상의 실제 호스트/그룹명이
# "harbor"가 맞는지 확인 필요 — 다르면 아래 hostvars['harbor'] 부분을 실제 이름으로 교체).
#
# [멱등성] kubectl 재실행 시 동일 값으로 덮어써도 안전하도록 `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` 패턴 사용.

# 작성자: 최유준
# 작성 날짜: 2026-09-02
#
# [수정 이력] 09/02 — hosts: cp-03 대상으로 확정 (Ansible Controller에는 kubectl 바이너리가
# 없어 delegate_to/localhost 방식 사용 불가). kubeconfig는 cp-03 로컬의
# /etc/kubernetes/admin.conf 사용 (Ansible Controller의 /home/cyj/.kube/seokpan-admin.conf와는
# 다른 경로이므로 혼동 주의 — 인계 기록 "kubeconfig 위치 혼동" 항목 참고).
# 09/02 — jenkins-admin Secret 생성 task 추가 (기존에는 harbor 관련 두 Secret만 존재,
# Jenkins Controller가 필수로 요구하는 admin 계정 Secret이 누락되어 있었음)

- name: 필수 Vault 변수 정의 여부 확인
  ansible.builtin.assert:
    that:
      - vault_harbor_robot_secret is defined
      - vault_jenkins_admin_username is defined
      - vault_jenkins_admin_password is defined
    fail_msg: "필수 vault 변수가 정의되지 않았습니다. group_vars/all/vault.yml 확인 필요"

- name: jenkins-admin Secret 적용 (Jenkins Controller 최초 관리자 계정)
  ansible.builtin.shell: |
    kubectl create secret generic jenkins-admin \
      --namespace=cicd \
      --kubeconfig=/etc/kubernetes/admin.conf \
      --from-literal=username="{{ vault_jenkins_admin_username }}" \
      --from-literal=password="{{ vault_jenkins_admin_password }}" \
      --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
  no_log: true
  changed_when: true

- name: harbor-robot-dockerconfig Secret 적용 (BuildKit rootless Agent Pod가 마운트)
  ansible.builtin.shell: |
    kubectl create secret docker-registry harbor-robot-dockerconfig \
      --namespace=cicd \
      --kubeconfig=/etc/kubernetes/admin.conf \
      --docker-server={{ hostvars['harbor'].harbor_hostname }} \
      --docker-username="robot${{ hostvars['harbor'].harbor_robot_name }}" \
      --docker-password="{{ vault_harbor_robot_secret }}" \
      --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
  no_log: true
  changed_when: true

- name: jenkins-harbor-credential Secret 적용 (JCasC 환경변수 치환용, Jenkins Credential Store 바인딩)
  ansible.builtin.shell: |
    kubectl create secret generic jenkins-harbor-credential \
      --namespace=cicd \
      --kubeconfig=/etc/kubernetes/admin.conf \
      --from-literal=username="robot${{ hostvars['harbor'].harbor_robot_name }}" \
      --from-literal=password="{{ vault_harbor_robot_secret }}" \
      --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
  no_log: true
  changed_when: true

- name: 생성된 Secret 목록 확인 (요약)
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret jenkins-admin harbor-robot-dockerconfig jenkins-harbor-credential -n cicd
  register: jenkins_secrets_summary
  changed_when: false

- name: 결과 요약 출력
  ansible.builtin.debug:
    var: jenkins_secrets_summary.stdout_lines
