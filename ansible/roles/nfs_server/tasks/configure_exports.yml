---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: NFS Export 디렉터리 생성 및 /etc/exports 배포 (idempotent)

- name: Export 대상 디렉터리 생성
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ nfs_server_export_dir_owner }}"
    group: "{{ nfs_server_export_dir_group }}"
    mode: "{{ item.mode }}"
  loop: "{{ nfs_server_exports }}"
  loop_control:
    label: "{{ item.path }}"

- name: /etc/exports 배포
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports
