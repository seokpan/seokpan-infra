---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단
# Purpose: mariadb_account role entrypoint (이슈 #91)

- name: ansible.mariadb 모듈 요구사항(PyMySQL) 설치
  ansible.builtin.dnf:
    name: python3-PyMySQL
    state: present

- name: 실제 Master 서버 판별
  ansible.builtin.import_tasks: detect_master.yml

- name: identity_svc/game_svc/db_admin 계정 및 권한 부여
  ansible.builtin.import_tasks: accounts.yml
