---
# Owner: 정태훈
# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: container_runtime default variables

containerd_package: "containerd.io"
containerd_version: "2.3.3-1.el9"

docker_repo_url: "https://download.docker.com/linux/centos/docker-ce.repo"

containerd_config_dir: "/etc/containerd"
containerd_config_file: "/etc/containerd/config.toml"

# crictl Runtime Tooling
crictl_version: "v1.36.0"
crictl_archive: "crictl-{{ crictl_version }}-linux-amd64.tar.gz"
crictl_download_url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/{{ crictl_archive }}"
crictl_archive_sha256: "83855e114566a8a8c44c548d515670f51de3a5e1da8b2effb59870e2f10c25a3"

crictl_cache_dir: "/var/cache/seokpan/crictl/{{ crictl_version }}"
crictl_install_path: "/usr/local/bin/crictl"
crictl_config_path: "/etc/crictl.yaml"

crictl_runtime_endpoint: "unix:///run/containerd/containerd.sock"
