---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02 Restore 전체 실행 흐름
#          Restore Decision이 RESTORE인 경우에만 포함된다.
#          STOP 상태에서는 이 파일 자체가 실행되지 않는다.
#
# 최초 작성 시간: 2026-09-15

- name: Final Restore Gate 실행
  ansible.builtin.import_tasks: final_restore_gate.yml

- name: Restore 시작 RTO 기록
  ansible.builtin.import_tasks: rto.yml
  vars:
    dr_rto_stage: restore_start

- name: Restore 환경 초기화
  ansible.builtin.import_tasks: restore_init.yml

- name: etcd Snapshot Restore
  ansible.builtin.import_tasks: restore.yml

- name: etcd quorum 및 health 검증
  ansible.builtin.import_tasks: etcd_validate.yml
  run_once: true

- name: etcd quorum 완료 RTO 기록
  ansible.builtin.import_tasks: rto.yml
  vars:
    dr_rto_stage: etcd_quorum_ready
