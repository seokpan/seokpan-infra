---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02(#176) 격리 환경 초기화 (STEP 6) — 3-member 각 노드에서
#          이전 실행의 잔존 데이터/서비스를 정리하고 포트 충돌을 사전 확인한다.
#          dr_isolated_etcd 그룹 전체를 대상으로 개별 실행된다.
# 최초 작성 시간: 2026-09-14 (정확한 시:분:초는 커밋 시점에 맞춰 조정 필요)
# 수정 시간: 2026-09-14

- name: 기존 etcd-dr 서비스 중지 (이전 실행 잔존 시)
  systemd:
    name: etcd-dr
    state: stopped
  failed_when: false
  register: dr_service_stop_result

- name: 기존 Restore data-dir 제거 (재실행 대비 초기화)
  file:
    path: "{{ restore_data_dir }}"
    state: absent

- name: 현재 리스닝 포트 확인 (2379/2380 충돌 여부 사전 점검)
  command: ss -ltn
  changed_when: false
  register: dr_port_check

- name: 클라이언트/피어 포트가 이미 사용 중이면 즉시 중단
  fail:
    msg: >
      포트 {{ item }}이(가) 이미 사용 중입니다. etcd-dr 서비스 중지가
      제대로 안 됐거나 다른 프로세스가 점유하고 있을 수 있습니다.
  when: "':' + (item | string) in dr_port_check.stdout"
  loop:
    - "{{ etcd_client_port }}"
    - "{{ etcd_peer_port }}"

- name: 격리 환경 초기화 완료 기록 (Evidence 연계용 fact)
  set_fact:
    dr_restore_init_done: true
