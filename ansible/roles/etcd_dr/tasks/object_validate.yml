---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02(#176) Object Baseline 비교 (STEP 15)
#          STEP 4에서 cp-01 기준으로 수집해둔 baseline과, 복구된 클러스터의
#          실제 상태를 비교해 diff가 0인지 확인한다.
# 최초 작성 시간: 2026-09-15 (정확한 시:분:초는 커밋 시점에 맞춰 조정 필요)
# 수정 시간: 2026-09-15

- name: (복구 클러스터) Namespace 목록 조회
  command: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    get namespaces -o json
  changed_when: false
  register: dr_restored_ns_raw

- name: (복구 클러스터) Deployment 목록 조회 (전체 namespace)
  command: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    get deployments -A -o json
  changed_when: false
  register: dr_restored_deploy_raw

- name: (복구 클러스터) Secret 목록 조회 (전체 namespace)
  command: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    get secrets -A -o json
  changed_when: false
  register: dr_restored_secret_raw

- name: 복구 클러스터 Namespace 정규화
  set_fact:
    dr_restored_namespaces: >-
      {{
        (dr_restored_ns_raw.stdout | from_json)['items']
        | map(attribute='metadata.name') | sort | list
      }}

- name: 복구 클러스터 Deployment 정규화 (namespace/name 문자열 리스트로 누적)
  set_fact:
    dr_restored_deployments: "{{ dr_restored_deployments | default([]) + [item.metadata.namespace ~ '/' ~ item.metadata.name] }}"
  loop: "{{ (dr_restored_deploy_raw.stdout | from_json)['items'] }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: 복구 클러스터 Deployment 목록 정렬
  set_fact:
    dr_restored_deployments: "{{ dr_restored_deployments | default([]) | sort | list }}"

- name: 복구 클러스터 Secret 정규화 (namespace/name 문자열 리스트로 누적)
  set_fact:
    dr_restored_secrets: "{{ dr_restored_secrets | default([]) + [item.metadata.namespace ~ '/' ~ item.metadata.name] }}"
  loop: "{{ (dr_restored_secret_raw.stdout | from_json)['items'] }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: 복구 클러스터 Secret 목록 정렬
  set_fact:
    dr_restored_secrets: "{{ dr_restored_secrets | default([]) | sort | list }}"

# --- Diff 계산 ---

- name: Namespace diff 계산
  set_fact:
    dr_ns_added: "{{ dr_restored_namespaces | difference(dr_baseline_namespaces) }}"
    dr_ns_removed: "{{ dr_baseline_namespaces | difference(dr_restored_namespaces) }}"

- name: Deployment diff 계산
  set_fact:
    dr_deploy_added: "{{ dr_restored_deployments | difference(dr_baseline_deployments) }}"
    dr_deploy_removed: "{{ dr_baseline_deployments | difference(dr_restored_deployments) }}"

- name: Secret diff 계산
  set_fact:
    dr_secret_added: "{{ dr_restored_secrets | difference(dr_baseline_secrets) }}"
    dr_secret_removed: "{{ dr_baseline_secrets | difference(dr_restored_secrets) }}"

- name: Object diff 결과 표시
  debug:
    msg:
      - "Namespace — baseline: {{ dr_baseline_namespaces | length }}, 복구후: {{ dr_restored_namespaces | length }}, added: {{ dr_ns_added }}, removed: {{ dr_ns_removed }}"
      - "Deployment — baseline: {{ dr_baseline_deployments | length }}, 복구후: {{ dr_restored_deployments | length }}, added: {{ dr_deploy_added }}, removed: {{ dr_deploy_removed }}"
      - "Secret — baseline: {{ dr_baseline_secrets | length }}, 복구후: {{ dr_restored_secrets | length }}, added: {{ dr_secret_added }}, removed: {{ dr_secret_removed }}"

- name: Object diff가 0인지 확인 (전량 일치 필수)
  assert:
    that:
      - dr_ns_added | length == 0
      - dr_ns_removed | length == 0
      - dr_deploy_added | length == 0
      - dr_deploy_removed | length == 0
      - dr_secret_added | length == 0
      - dr_secret_removed | length == 0
    fail_msg: >
      Object diff가 발견되었습니다. baseline(snapshot 생성 시점)과
      복구된 클러스터의 상태가 일치하지 않습니다.
    success_msg: >
      Object 정합성 확인 완료 — Namespace/Deployment/Secret 전량 일치
      (diff 0)

- name: STEP 15 검증 결과 기록 (Evidence 연계용 fact)
  set_fact:
    dr_object_validate_passed: true
    dr_object_diff_summary:
      namespace: { baseline: "{{ dr_baseline_namespaces | length }}", restored: "{{ dr_restored_namespaces | length }}", matched: "{{ dr_ns_added | length == 0 and dr_ns_removed | length == 0 }}" }
      deployment: { baseline: "{{ dr_baseline_deployments | length }}", restored: "{{ dr_restored_deployments | length }}", matched: "{{ dr_deploy_added | length == 0 and dr_deploy_removed | length == 0 }}" }
      secret: { baseline: "{{ dr_baseline_secrets | length }}", restored: "{{ dr_restored_secrets | length }}", matched: "{{ dr_secret_added | length == 0 and dr_secret_removed | length == 0 }}" }
