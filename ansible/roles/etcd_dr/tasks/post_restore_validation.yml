---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02 Restore 이후 kube-apiserver 및 Kubernetes Object 검증 흐름
#          Restore Decision이 RESTORE인 경우에만 실행된다.
#
# 최초 작성 시간: 2026-09-15

- name: Podman 실행 환경 준비
  ansible.builtin.import_tasks: podman_setup.yml

- name: DR CA 구성
  ansible.builtin.import_tasks: ca_setup.yml

- name: kube-apiserver 기동
  ansible.builtin.import_tasks: kube_apiserver.yml

- name: kube-apiserver Ready RTO 기록
  ansible.builtin.import_tasks: rto.yml
  vars:
    dr_rto_stage: kube_api_ready

- name: Kubernetes API 인증 검증
  ansible.builtin.import_tasks: kube_api_validate.yml

- name: Kubernetes Object 검증
  ansible.builtin.import_tasks: object_validate.yml

- name: Object 검증 완료 RTO 기록
  ansible.builtin.import_tasks: rto.yml
  vars:
    dr_rto_stage: object_validation_complete
