---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02 Restore Decision Gate
#          Safety Guard 통과 여부와 명시적인 Restore 요청 여부를 확인하여
#          실제 Restore 실행 여부를 결정한다.
#
#          기본값은 STOP이며,
#          -e dr_restore_requested=true가 명시된 경우에만 RESTORE를 허용한다.
#
# 최초 작성 시간: 2026-09-15

- name: Safety Guard 통과 여부 확인
  ansible.builtin.assert:
    that:
      - dr_config_guard_passed | default(false) | bool
    fail_msg: >
      Safety Guard가 통과되지 않았습니다.
      Restore Decision을 진행하지 않습니다.
    success_msg: "Safety Guard PASS 확인"

- name: Restore 요청 여부 확인
  ansible.builtin.set_fact:
    dr_restore_decision: >-
      {{ 'RESTORE' if (dr_restore_requested | default(false) | bool)
         else 'STOP' }}

- name: Restore Decision 결과 기록
  ansible.builtin.debug:
    msg:
      - "Restore Requested : {{ dr_restore_requested | default(false) }}"
      - "Safety Guard      : {{ dr_config_guard_passed | default(false) }}"
      - "Restore Decision  : {{ dr_restore_decision }}"

- name: Restore 요청이 없으면 정상 중단
  ansible.builtin.debug:
    msg: >
      Restore 요청이 명시되지 않았습니다.
      Restore 작업을 수행하지 않고 여기서 중단합니다.
  when: dr_restore_decision == 'STOP'

- name: Restore Decision 확인 시각 기록
  ansible.builtin.set_fact:
    dr_restore_decision_checked_at: "{{ ansible_facts['date_time']['iso8601'] }}"

- name: Restore Decision Gate 통과 기록
  ansible.builtin.set_fact:
    dr_restore_decision_passed: true
  when: dr_restore_decision == 'RESTORE'
