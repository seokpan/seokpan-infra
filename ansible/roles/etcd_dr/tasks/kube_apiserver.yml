---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02(#176) kube-apiserver 컨테이너 기동 (STEP 12, Podman 직접 run
#          방식 — 컨테이너 런타임 미보유 검증 환경 제약에 따른 대체 방식).
#          복구된 3-member etcd(무인증 http)를 backend로 사용하며, 운영
#          manifest의 --etcd-cafile/certfile/keyfile은 제거(우리 etcd는
#          TLS 미사용). self-signed CA(STEP 13, A안)로 발급한 인증서 사용.
# 최초 작성 시간: 2026-09-14 (정확한 시:분:초는 커밋 시점에 맞춰 조정 필요)
# 수정 시간: 2026-09-14

- name: 자기 자신의 advertise-address 결정
  set_fact:
    dr_advertise_address: "{{ restore_member_map[inventory_hostname].ip }}"

- name: 3-member etcd 전체 endpoint 목록 조합 (comma-separated)
  set_fact:
    dr_etcd_endpoints: "{{ restore_member_map.values() | map(attribute='ip') | map('regex_replace', '^(.*)$', 'http://\\1:' + (etcd_client_port | string)) | join(',') }}"

- name: 기존 kube-apiserver 컨테이너 정리 (재실행 대비)
  command: podman rm -f dr-kube-apiserver
  failed_when: false
  changed_when: true

- name: kube-apiserver 컨테이너 기동
  command: >
    podman run -d
    --name dr-kube-apiserver
    --network host
    -v {{ dr_ca_dir }}:/etc/kubernetes/pki:ro
    registry.k8s.io/kube-apiserver:v1.36.2
    kube-apiserver
    --advertise-address={{ dr_advertise_address }}
    --allow-privileged=true
    --authorization-mode=Node,RBAC
    --client-ca-file=/etc/kubernetes/pki/ca.crt
    --etcd-servers={{ dr_etcd_endpoints }}
    --secure-port={{ kube_apiserver_port }}
    --service-account-issuer=https://kubernetes.default.svc.cluster.local
    --service-account-key-file=/etc/kubernetes/pki/sa.pub
    --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
    --service-cluster-ip-range=10.96.0.0/12
    --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
    --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
  changed_when: true
  register: dr_apiserver_start_result

- name: kube-apiserver 기동 대기 (초기 준비 시간)
  pause:
    seconds: 15

- name: kube-apiserver 컨테이너 상태 확인
  command: podman ps --filter name=dr-kube-apiserver --format "{{ '{{' }}.Status{{ '}}' }}"
  changed_when: false
  register: dr_apiserver_status

- name: kube-apiserver 컨테이너가 기동 상태인지 확인
  assert:
    that:
      - "'Up' in dr_apiserver_status.stdout"
    fail_msg: >
      kube-apiserver 컨테이너가 기동되지 않았습니다.
      "podman logs dr-kube-apiserver"로 원인을 확인하세요.
      status={{ dr_apiserver_status.stdout }}
    success_msg: "kube-apiserver 컨테이너 기동 확인"

- name: kube-apiserver 기동 완료 기록 (Evidence 연계용 fact)
  set_fact:
    dr_kube_apiserver_started: true
    dr_kube_apiserver_status: "{{ dr_apiserver_status.stdout }}"
