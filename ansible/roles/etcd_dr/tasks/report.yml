---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02(#176) 실행 결과 Evidence 및 Report 자동 생성
#
# Evidence는 Ansible Controller에 저장한다.
# 실행 결과:
#   <repo-root>/dr-evidence/<run-id>/
#
# STOP 실행과 RESTORE 실행을 구분하여 기록한다.
# STOP 상태에서 실행되지 않은 검증은 executed=false, passed=null로 기록한다.
#
# 최초 작성 시간: 2026-09-15

- name: DR Evidence Run ID 생성
  ansible.builtin.set_fact:
    dr_evidence_run_id: "{{ ansible_facts['date_time']['epoch'] }}"

- name: DR Evidence 상태 계산
  ansible.builtin.set_fact:
    dr_evidence_decision: "{{ dr_restore_decision | default('STOP') }}"
    dr_evidence_restore_executed: "{{ (dr_restore_decision | default('STOP')) == 'RESTORE' }}"
    dr_evidence_etcd_executed: "{{ dr_etcd_validate_passed is defined }}"
    dr_evidence_api_executed: "{{ dr_kube_api_validated is defined }}"
    dr_evidence_object_executed: "{{ dr_object_validate_passed is defined }}"

- name: DR Evidence 전체 결과 계산
  ansible.builtin.set_fact:
    dr_evidence_overall_status: >-
      {%- if (dr_restore_decision | default('STOP')) == 'STOP' -%}
      STOP
      {%- elif
        (dr_snapshot_verified | default(false) | bool)
        and (dr_config_guard_passed | default(false) | bool)
        and (dr_restore_decision_passed | default(false) | bool)
        and (hostvars[groups['dr_isolated_etcd'][0]].dr_final_restore_gate_passed | default(false) | bool)
        and (dr_etcd_validate_passed | default(false) | bool)
        and (dr_kube_api_validated | default(false) | bool)
        and (dr_object_validate_passed | default(false) | bool)
      -%}
      PASS
      {%- else -%}
      FAIL
      {%- endif -%}

- name: DR Evidence 디렉터리 생성
  ansible.builtin.file:
    path: "{{ evidence_dir }}/{{ dr_evidence_run_id }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: metadata.json 생성
  ansible.builtin.copy:
    content: |
      {
        "run_id": {{ dr_evidence_run_id | to_json }},
        "generated_at": {{ ansible_facts['date_time']['iso8601'] | to_json }},
        "restore_requested": {{ (dr_restore_requested | default(false) | bool) | lower }},
        "restore_decision": {{ (dr_restore_decision | default('STOP')) | to_json }},
        "overall_status": {{ dr_evidence_overall_status | to_json }},
        "target_hosts": {{ groups['dr_isolated_etcd'] | default([]) | to_json }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/metadata.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: snapshot-status.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": true,
        "passed": {{ (dr_snapshot_verified | default(false) | bool) | lower }},
        "filename": {{ (dr_snapshot_filename | default('UNSET')) | to_json }},
        "sha256": {{ (dr_snapshot_sha256 | default('UNSET')) | to_json }},
        "status": {{ (dr_snapshot_status | default({})) | to_json }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/snapshot-status.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: safety-guard.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": true,
        "passed": {{ (dr_config_guard_passed | default(false) | bool) | lower }},
        "checked_at": {{ (dr_config_guard_checked_at | default('UNSET')) | to_json }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/safety-guard.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: restore-decision.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": true,
        "requested": {{ (dr_restore_requested | default(false) | bool) | lower }},
        "decision": {{ (dr_restore_decision | default('STOP')) | to_json }},
        "passed": {{
          (
            dr_restore_decision_passed
            if dr_restore_decision_passed is defined
            else none
          ) | to_json
        }},
        "checked_at": {{ (dr_restore_decision_checked_at | default('UNSET')) | to_json }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/restore-decision.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: final-restore-gate.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": {{ dr_evidence_restore_executed | lower }},
        "passed": {{
          (
            hostvars[groups['dr_isolated_etcd'][0]].dr_final_restore_gate_passed
            if dr_evidence_restore_executed
            else none
          ) | to_json
        }},
        "checked_at": {{
          (
            hostvars[groups['dr_isolated_etcd'][0]].dr_final_restore_gate_checked_at
            if dr_evidence_restore_executed
            else none
          ) | to_json
        }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/final-restore-gate.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: etcd-validation.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": {{ dr_evidence_etcd_executed | lower }},
        "passed": {{
          (
            dr_etcd_validate_passed
            if dr_evidence_etcd_executed
            else none
          ) | to_json
        }},
        "member_count": {{
          (
            dr_etcd_member_count
            if dr_evidence_etcd_executed
            else none
          ) | to_json
        }},
        "leader_id": {{
          (
            dr_etcd_leader_id
            if dr_evidence_etcd_executed
            else none
          ) | to_json
        }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/etcd-validation.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: api-validation.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": {{ dr_evidence_api_executed | lower }},
        "passed": {{
          (
            dr_kube_api_validated
            if dr_evidence_api_executed
            else none
          ) | to_json
        }},
        "namespace_count": {{
          (
            dr_kube_api_namespace_count
            if dr_evidence_api_executed
            else none
          ) | to_json
        }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/api-validation.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: object-validation.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": {{ dr_evidence_object_executed | lower }},
        "passed": {{
          (
            dr_object_validate_passed
            if dr_evidence_object_executed
            else none
          ) | to_json
        }},
        "diff_summary": {{
          (
            dr_object_diff_summary
            if dr_evidence_object_executed
            else none
          ) | to_json
        }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/object-validation.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: RTO 계산
  ansible.builtin.set_fact:
    dr_rto_restore_to_quorum: >-
      {{
        (etcd_quorum_ready | int) - (restore_start | int)
        if (
          dr_evidence_restore_executed
          and restore_start is defined
          and etcd_quorum_ready is defined
        )
        else none
      }}
    dr_rto_quorum_to_api: >-
      {{
        (kube_api_ready | int) - (etcd_quorum_ready | int)
        if (
          dr_evidence_restore_executed
          and kube_api_ready is defined
          and etcd_quorum_ready is defined
        )
        else none
      }}
    dr_rto_api_to_object: >-
      {{
        (object_validation_complete | int) - (kube_api_ready | int)
        if (
          dr_evidence_restore_executed
          and object_validation_complete is defined
          and kube_api_ready is defined
        )
        else none
      }}
    dr_rto_total: >-
      {{
        (object_validation_complete | int) - (restore_start | int)
        if (
          dr_evidence_restore_executed
          and object_validation_complete is defined
          and restore_start is defined
        )
        else none
      }}

- name: rto.json 생성
  ansible.builtin.copy:
    content: |
      {
        "executed": {{ dr_evidence_restore_executed | lower }},
        "restore_start": {{ restore_start | default(none) | to_json }},
        "etcd_quorum_ready": {{ etcd_quorum_ready | default(none) | to_json }},
        "kube_api_ready": {{ kube_api_ready | default(none) | to_json }},
        "object_validation_complete": {{ object_validation_complete | default(none) | to_json }},
        "restore_to_quorum_seconds": {{ dr_rto_restore_to_quorum | to_json }},
        "quorum_to_api_seconds": {{ dr_rto_quorum_to_api | to_json }},
        "api_to_object_seconds": {{ dr_rto_api_to_object | to_json }},
        "total_rto_seconds": {{ dr_rto_total | to_json }}
      }
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/rto.json"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: report.md 생성
  ansible.builtin.copy:
    content: |
      # DR-02 Recovery Evidence Report

      ## 1. Execution Summary

      | Item | Result |
      |---|---|
      | Run ID | `{{ dr_evidence_run_id }}` |
      | Generated At | `{{ ansible_facts['date_time']['iso8601'] }}` |
      | Restore Requested | `{{ dr_restore_requested | default(false) }}` |
      | Restore Decision | `{{ dr_restore_decision | default('STOP') }}` |
      | Overall Status | **{{ dr_evidence_overall_status }}** |

      ## 2. Snapshot

      - Executed: `true`
      - Verified: `{{ dr_snapshot_verified | default(false) }}`
      - Filename: `{{ dr_snapshot_filename | default('UNSET') }}`
      - SHA-256: `{{ dr_snapshot_sha256 | default('UNSET') }}`

      ## 3. Safety Guard

      - Executed: `true`
      - Passed: `{{ dr_config_guard_passed | default(false) }}`
      - Checked At: `{{ dr_config_guard_checked_at | default('UNSET') }}`

      ## 4. Restore Decision

      - Requested: `{{ dr_restore_requested | default(false) }}`
      - Decision: `{{ dr_restore_decision | default('STOP') }}`
      - Decision Gate Passed: `{{ dr_restore_decision_passed | default('N/A', true) }}`

      ## 5. Final Restore Gate

      - Executed: `{{ dr_evidence_restore_executed }}`
      - Passed: {{
          hostvars[groups['dr_isolated_etcd'][0]].dr_final_restore_gate_passed
          if dr_evidence_restore_executed
          else 'N/A'
        }}

      ## 6. etcd Validation

      - Executed: `{{ dr_evidence_etcd_executed }}`
      - Passed: {{
          dr_etcd_validate_passed
          if dr_evidence_etcd_executed
          else 'N/A'
        }}
      - Member Count: {{
          dr_etcd_member_count
          if dr_evidence_etcd_executed
          else 'N/A'
        }}
      - Leader ID: {{
          dr_etcd_leader_id
          if dr_evidence_etcd_executed
          else 'N/A'
        }}

      ## 7. Kubernetes API Validation

      - Executed: `{{ dr_evidence_api_executed }}`
      - Passed: {{
          dr_kube_api_validated
          if dr_evidence_api_executed
          else 'N/A'
        }}
      - Namespace Count: {{
          dr_kube_api_namespace_count
          if dr_evidence_api_executed
          else 'N/A'
        }}

      ## 8. Kubernetes Object Validation

      - Executed: `{{ dr_evidence_object_executed }}`
      - Passed: {{
          dr_object_validate_passed
          if dr_evidence_object_executed
          else 'N/A'
        }}
      - Diff Summary:
        ```yaml
        {{
          dr_object_diff_summary
          if dr_evidence_object_executed
          else 'N/A'
        }}
        ```

      ## 9. RTO

      - Executed: `{{ dr_evidence_restore_executed }}`
      - Restore → etcd Quorum: `{{ dr_rto_restore_to_quorum | default('N/A', true) }}{% if dr_rto_restore_to_quorum is defined and dr_rto_restore_to_quorum is not none %} seconds{% endif %}`
      - etcd Quorum → API Ready: `{{ dr_rto_quorum_to_api | default('N/A', true) }}{% if dr_rto_quorum_to_api is defined and dr_rto_quorum_to_api is not none %} seconds{% endif %}`
      - API Ready → Object Validation: `{{ dr_rto_api_to_object | default('N/A', true) }}{% if dr_rto_api_to_object is defined and dr_rto_api_to_object is not none %} seconds{% endif %}`
      - Total RTO: **`{{ dr_rto_total | default('N/A', true) }}{% if dr_rto_total is defined and dr_rto_total is not none %} seconds{% endif %}`**

      ## 10. Conclusion

      {% if dr_evidence_overall_status == 'STOP' %}
      Restore 요청이 명시되지 않아 안전하게 Restore 작업을 수행하지 않고 정상 중단되었습니다.
      {% elif dr_evidence_overall_status == 'PASS' %}
      Safety Guard, Restore Decision, Final Restore Gate, etcd quorum/health,
      Kubernetes API 및 Object 검증을 모두 통과했습니다.
      {% else %}
      Restore 경로가 실행되었으나 하나 이상의 최종 검증 항목이 통과하지 못했습니다.
      {% endif %}
    dest: "{{ evidence_dir }}/{{ dr_evidence_run_id }}/report.md"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: Evidence 생성 결과 표시
  ansible.builtin.debug:
    msg:
      - "DR Evidence Run ID : {{ dr_evidence_run_id }}"
      - "Evidence Directory : {{ evidence_dir }}/{{ dr_evidence_run_id }}"
      - "Restore Decision   : {{ dr_restore_decision | default('STOP') }}"
      - "Overall Status     : {{ dr_evidence_overall_status }}"
