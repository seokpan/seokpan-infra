---
# Owner: 김상희
# Scope: Data, Storage & Recovery
# Project: 石나가는 판단(Seokpan)
# Purpose: DR-02 etcd Snapshot Restore 자동화(#176) 기본 변수 정의
# 최초 작성 시간: 2026-09-14 (정확한 시:분:초는 커밋 시점에 맞춰 조정 필요)
# 수정 시간: 2026-09-14 (STEP 4 Snapshot 관련 변수 추가 —
#            healthcheck-client 인증서 경로, Controller 스테이징 경로)

# --- Snapshot ---
snapshot_source_host: cp-01
snapshot_remote_path: /root/etcd-snapshots
snapshot_local_stage: /tmp/etcd-snapshot-src
snapshot_target_dir: /root/etcd-snapshots
etcd_tools_path: /opt/seokpan/etcd-tools/current
etcd_ca_cert: /etc/kubernetes/pki/etcd/ca.crt
etcd_client_cert: /etc/kubernetes/pki/etcd/healthcheck-client.crt
etcd_client_key: /etc/kubernetes/pki/etcd/healthcheck-client.key
etcd_client_endpoint: "https://127.0.0.1:2379"

# --- Restore ---
restore_data_dir: /var/lib/etcd-dr
restore_cluster_token: "etcd-dr-{{ ansible_facts['date_time']['epoch'] }}"
restore_member_map:
  loadgen:  { name: restore-1, ip: 10.1.93.95 }
  loadgen2: { name: restore-2, ip: 10.1.93.96 }
  loadgen3: { name: restore-3, ip: 10.1.93.97 }
etcd_client_port: 2379
etcd_peer_port: 2380

# --- Restore Decision Gate ---
# 기본값은 Restore 금지.
# 실제 DR 복구 실행 시에만 -e dr_restore_requested=true로 명시한다.
dr_restore_requested: false

# --- Config Guard (STEP 7) ---
prod_etcd_ips:
  - 192.168.51.20
  - 192.168.52.20
  - 192.168.53.20

# 운영 Kubernetes API VIP
prod_kubernetes_api_ip: 10.1.93.90

prod_etcd_data_dir: /var/lib/etcd

# --- kube-apiserver ---
kube_apiserver_port: 6443
kubeconfig_path: /root/.kube/dr-recovery-config
dr_ca_dir: /root/dr-etcd-ca

# --- Evidence ---
evidence_dir: "{{ playbook_dir }}/../../dr-evidence"
