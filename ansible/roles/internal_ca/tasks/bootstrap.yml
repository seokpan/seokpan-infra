---
# 작성자: 최유준
# 작성 날짜: 2026-09-09
#
# CA 디렉토리 준비, 키/인증서 최초 발급, 기존 CA의 필수 확장 보정까지
# 담당한다. 이 파일은 internal_ca_dir 등 변수를 오버라이드해서 독립
# 호출 가능하도록 설계되어 있으며, 테스트 playbook이 격리된 디렉토리를
# 대상으로 이 파일만 직접 include하여 실제 로직을 검증한다.

- name: Ensure CA directory exists with restricted permissions
  ansible.builtin.file:
    path: "{{ internal_ca_dir }}"
    state: directory
    owner: "{{ internal_ca_owner }}"
    group: "{{ internal_ca_group }}"
    mode: "0700"

- name: Check if Root CA key already exists
  ansible.builtin.stat:
    path: "{{ internal_ca_key_path }}"
  register: internal_ca_key_check

- name: Check if Root CA cert already exists
  ansible.builtin.stat:
    path: "{{ internal_ca_cert_path }}"
  register: internal_ca_cert_check

- name: Generate Root CA private key
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ internal_ca_key_path }} {{ internal_ca_key_bits }}
  when: not internal_ca_key_check.stat.exists

- name: Restrict Root CA private key permissions
  ansible.builtin.file:
    path: "{{ internal_ca_key_path }}"
    owner: "{{ internal_ca_owner }}"
    group: "{{ internal_ca_group }}"
    mode: "0600"

# ============================================================
# 최초 발급 경로 — Root CA 필수 확장을 처음부터 명시
# (리뷰 지적 #2: 여기 누락 시 재구축할 때마다 동일 결함 재발생)
# ============================================================
- name: Generate self-signed Root CA certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes
      -key {{ internal_ca_key_path }}
      -sha256 -days {{ internal_ca_days }}
      -out {{ internal_ca_cert_path }}
      -subj "/C={{ internal_ca_country }}/O={{ internal_ca_organization }}/CN={{ internal_ca_common_name }}"
      -addext "keyUsage=critical,keyCertSign,cRLSign"
      -addext "basicConstraints=critical,CA:TRUE"
      -addext "subjectKeyIdentifier=hash"
      -addext "authorityKeyIdentifier=keyid:always,issuer"
  when: not internal_ca_cert_check.stat.exists

- name: Set Root CA certificate permissions (readable by all - public cert)
  ansible.builtin.file:
    path: "{{ internal_ca_cert_path }}"
    owner: root
    group: root
    mode: "0644"

# ============================================================
# 기존 CA 마이그레이션 경로 — 과거 잘못 발급된 CA를 보정
# ============================================================
- name: Root CA 인증서 내용 조회 (필수 확장 상태 판정용)
  ansible.builtin.command:
    cmd: openssl x509 -in {{ internal_ca_cert_path }} -noout -text
  register: internal_ca_cert_text
  changed_when: false
  check_mode: false
  when: internal_ca_cert_check.stat.exists

# 리뷰 지적 #3: 재발급 후 assert와 동일한 4개 조건으로 Desired State 판정
- name: Root CA 재발급 필요 여부 판단 (Desired State 미달 시 True)
  ansible.builtin.set_fact:
    internal_ca_needs_keyusage_fix: >-
      {{
        internal_ca_cert_check.stat.exists and
        not (
          'CA:TRUE' in internal_ca_cert_text.stdout and
          'X509v3 Key Usage: critical' in internal_ca_cert_text.stdout and
          'Certificate Sign' in internal_ca_cert_text.stdout and
          'CRL Sign' in internal_ca_cert_text.stdout
        )
      }}

# 리뷰 지적 #1: 아래 추출 명령을 재발급 후 태스크와 완전히 동일하게 맞춤
- name: 재발급 전 Root CA의 Subject Key Identifier 저장 (동일성 검증 기준값)
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in {{ internal_ca_cert_path }} -noout -text | grep -A1 "Subject Key Identifier" | tail -1 | xargs
  args:
    executable: /bin/bash
  register: internal_ca_ski_before
  changed_when: false
  check_mode: false
  when: internal_ca_needs_keyusage_fix

- name: 기존 Root CA 인증서 백업
  ansible.builtin.copy:
    src: "{{ internal_ca_cert_path }}"
    dest: "{{ internal_ca_cert_path }}.bak-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: internal_ca_needs_keyusage_fix

- name: Root CA 인증서 재발급 (동일 개인키 재사용, 필수 확장 추가)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes
      -key {{ internal_ca_key_path }}
      -sha256 -days {{ internal_ca_days }}
      -out {{ internal_ca_cert_path }}
      -subj "/C={{ internal_ca_country }}/O={{ internal_ca_organization }}/CN={{ internal_ca_common_name }}"
      -addext "keyUsage=critical,keyCertSign,cRLSign"
      -addext "basicConstraints=critical,CA:TRUE"
      -addext "subjectKeyIdentifier=hash"
      -addext "authorityKeyIdentifier=keyid:always,issuer"
  when: internal_ca_needs_keyusage_fix

- name: Root CA 인증서 권한 재설정 (재발급 시 갱신)
  ansible.builtin.file:
    path: "{{ internal_ca_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when: internal_ca_needs_keyusage_fix

# 리뷰 지적 #1: before와 동일한 추출 명령 (tail -1 | xargs)
- name: 재발급된 Root CA의 Subject Key Identifier 확인
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in {{ internal_ca_cert_path }} -noout -text | grep -A1 "Subject Key Identifier" | tail -1 | xargs
  args:
    executable: /bin/bash
  register: internal_ca_ski_after
  changed_when: false
  check_mode: false
  when: internal_ca_needs_keyusage_fix

- name: SKI 동일성 검증 (개인키 재사용 여부의 핵심 안전조건)
  ansible.builtin.assert:
    that:
      - internal_ca_ski_before.stdout == internal_ca_ski_after.stdout
    fail_msg: >-
      재발급 전/후 Subject Key Identifier가 다릅니다. 개인키가 의도치 않게
      변경됐을 가능성이 있으므로 즉시 중단하고 백업(ca.crt.bak-*)으로
      원복을 검토해야 합니다.
      Before={{ internal_ca_ski_before.stdout }} After={{ internal_ca_ski_after.stdout }}
    success_msg: "SKI 동일 확인: {{ internal_ca_ski_after.stdout }}"
  when: internal_ca_needs_keyusage_fix

- name: 재발급된 Root CA의 전체 확장 필드 조회
  ansible.builtin.command:
    cmd: openssl x509 -in {{ internal_ca_cert_path }} -noout -text
  register: internal_ca_cert_text_after
  changed_when: false
  check_mode: false
  when: internal_ca_needs_keyusage_fix

- name: Root CA 필수 확장 필드 검증 (Desired State 판정과 동일 기준)
  ansible.builtin.assert:
    that:
      - "'CA:TRUE' in internal_ca_cert_text_after.stdout"
      - "'X509v3 Key Usage: critical' in internal_ca_cert_text_after.stdout"
      - "'Certificate Sign' in internal_ca_cert_text_after.stdout"
      - "'CRL Sign' in internal_ca_cert_text_after.stdout"
    fail_msg: "재발급된 Root CA 인증서에 필수 확장이 누락됐습니다."
    success_msg: "Root CA 필수 확장 필드 검증 통과"
  when: internal_ca_needs_keyusage_fix

- name: Root CA Key Usage 보정 결과 요약 출력
  ansible.builtin.debug:
    msg:
      - "Key Usage 보정 수행 여부: {{ internal_ca_needs_keyusage_fix | default(false) }}"
      - "재발급 후 SKI: {{ internal_ca_ski_after.stdout | default('변경 없음 (보정 불필요)') }}"

- name: Ensure CA serial file exists
  ansible.builtin.command:
    cmd: openssl x509 -in {{ internal_ca_cert_path }} -noout -serial
  register: internal_ca_serial_check
  changed_when: false

- name: Initialize CA serial counter if missing
  ansible.builtin.copy:
    dest: "{{ internal_ca_dir }}/ca.srl"
    content: "01\n"
    owner: "{{ internal_ca_owner }}"
    group: "{{ internal_ca_group }}"
    mode: "0600"
    force: false

- name: Display Root CA summary
  ansible.builtin.debug:
    msg:
      - "Root CA Cert = {{ internal_ca_cert_path }}"
      - "Root CA Key  = {{ internal_ca_key_path }} (Controller 밖으로 절대 반출 금지)"
      - "CN = {{ internal_ca_common_name }}"
      - "유효기간 = {{ internal_ca_days }}일"
