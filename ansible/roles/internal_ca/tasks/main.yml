---
# 작성자: 최유준
# 작성 날짜: 2026-09-09
#
# CA 발급/보정 로직과 ConfigMap 게시를 분리했습니다. 테스트 playbook이
# bootstrap.yml만 별도 internal_ca_dir로 호출해 실제 프로덕션 로직을
# 격리 검증할 수 있도록 하기 위함입니다 (PR 리뷰 반영).

- name: Verify this role runs only on the Ansible Controller
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['ansible_controller']
    fail_msg: >-
      internal_ca role은 Ansible Controller에서만 실행해야 합니다.

- name: CA 발급/보정 로직 실행
  ansible.builtin.include_tasks: bootstrap.yml

- name: ConfigMap 게시
  ansible.builtin.include_tasks: publish_configmap.yml
