<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Infrastructure: the first-project MVP</title><desc id="desc">VM inventory and Ansible ownership / 4 physical hosts · 16 VMs</desc><rect width="1000" height="630" rx="20" fill="#f6f8fc"/>
