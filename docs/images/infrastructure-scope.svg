<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-labelledby="title desc"><title id="title">인프라 자동화 대상</title><desc id="desc">Ansible 제어 VM 1대가 네트워크 5대, Kubernetes 5대, 데이터베이스 3대, Harbor와 NFS 2대를 구성한다. 물리 호스트별 배치도는 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="615" rx="18" fill="#f7f9fc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">인프라 자동화 대상</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">물리 호스트 4대 위의 VM 16대 · Ansible Inventory 기준</text><rect x="32" y="102" width="936" height="95" rx="12" fill="#eaf1ff" stroke="#a9bee5"/><text x="52" y="137" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Ansible 제어 VM · 1대</text><text x="52" y="169" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">Inventory · Playbook · Role을 통해 아래 VM 그룹을 구성</text><path d="M 500 197 V 225 H 260 V 246" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 225 H 740 V 246" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 225 V 406 H 260 V 421" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 406 H 740 V 421" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="246" width="456" height="138" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="32" y="260" width="4" height="28" rx="2" fill="#2563eb"/><text x="50" y="278" font-family=